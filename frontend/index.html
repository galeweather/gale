<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gale — Open Weather Visualization</title>
<meta name="description" content="Free, open-source weather visualization for the United States. Radar, satellite, forecasts. No accounts, no tracking.">

<!-- Open Graph -->
<meta property="og:title" content="Gale — Open Weather Visualization">
<meta property="og:description" content="Free, open-source weather visualization for the United States. Real-time radar, satellite, HRRR forecasts, and NWS alerts.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://galeweather.github.io/gale/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Gale — Open Weather Visualization">
<meta name="twitter:description" content="Free, open-source weather visualization for the US. Real-time radar, satellite, HRRR forecasts, NWS alerts. No accounts, no tracking.">

<!-- MapLibre GL JS -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ═══════════════════════════════════════════
     CSS VARIABLES
     ═══════════════════════════════════════════ */
  :root {
    --bg-primary: #0a0e17;
    --bg-secondary: #111827;
    --bg-panel: rgba(10, 14, 23, 0.92);
    --bg-glass: rgba(17, 24, 39, 0.75);
    --border-subtle: rgba(255, 255, 255, 0.06);
    --border-active: rgba(99, 179, 237, 0.3);
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #38bdf8;
    --accent-dim: rgba(56, 189, 248, 0.15);
    --warning: #f59e0b;
    --danger: #ef4444;
    --success: #10b981;
    --radius: 12px;
    --radius-sm: 8px;
    --font: 'DM Sans', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --shadow-lg: 0 24px 48px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ═══════════════════════════════════════════
     RESET & BASE
     ═══════════════════════════════════════════ */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font);
    background: var(--bg-primary);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  /* ═══════════════════════════════════════════
     MAP (full bleed)
     ═══════════════════════════════════════════ */
  #map {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  /* MapLibre overrides */
  .maplibregl-ctrl-attrib { opacity: 0.4; font-size: 10px !important; }
  .maplibregl-ctrl-attrib a { color: var(--text-muted) !important; }
  .maplibregl-ctrl-group {
    background: var(--bg-panel) !important;
    border: 1px solid var(--border-subtle) !important;
    border-radius: var(--radius-sm) !important;
    overflow: hidden;
    backdrop-filter: blur(16px);
  }
  .maplibregl-ctrl-group button {
    width: 36px !important;
    height: 36px !important;
  }
  .maplibregl-ctrl-group button + button {
    border-top: 1px solid var(--border-subtle) !important;
  }
  .maplibregl-ctrl button .maplibregl-ctrl-icon {
    filter: invert(0.85);
  }

  /* ═══════════════════════════════════════════
     TOP BAR — Logo + Search
     ═══════════════════════════════════════════ */
  .top-bar {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }

  .logo {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    cursor: default;
    flex-shrink: 0;
    box-shadow: var(--shadow-md);
  }

  .logo-icon {
    width: 24px;
    height: 24px;
  }

  .logo-text {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .logo-badge {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 2px;
    transition: opacity var(--transition);
  }

  .logo-divider {
    width: 1px;
    height: 20px;
    background: var(--border-subtle);
    margin: 0 4px;
  }

  .logo-location {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    transition: all var(--transition);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
  }

  .logo-location:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.04); }
  .logo-location svg { width: 14px; height: 14px; flex-shrink: 0; }

  .search-container {
    pointer-events: auto;
    position: relative;
    flex: 1;
    max-width: 420px;
    display: none;
  }

  .search-container.open {
    display: block;
  }

  .locate-inline {
    pointer-events: auto;
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-subtle);
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    color: var(--text-secondary);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all var(--transition);
    box-shadow: var(--shadow-md);
  }

  .locate-inline:hover { border-color: var(--accent); color: var(--accent); }
  .locate-inline.visible { display: flex; }

  .search-close {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all var(--transition);
  }

  .search-close:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.06); }

  .recent-header {
    padding: 8px 16px 4px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .search-input {
    width: 100%;
    padding: 11px 36px 11px 40px;
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: border-color var(--transition);
    box-shadow: var(--shadow-md);
  }

  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus { border-color: var(--border-active); }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    overflow: hidden;
    display: none;
    box-shadow: var(--shadow-lg);
  }

  .search-results.active { display: block; }

  .search-result-item {
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    transition: background var(--transition);
    border-bottom: 1px solid var(--border-subtle);
  }

  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover {
    background: var(--accent-dim);
    color: var(--text-primary);
  }

  /* ═══════════════════════════════════════════
     RIGHT SIDEBAR — Layer Controls
     ═══════════════════════════════════════════ */
  .sidebar {
    position: fixed;
    top: 80px;
    right: 16px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 6px;
    box-shadow: var(--shadow-md);
  }

  .layer-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
    min-width: 120px;
  }

  .layer-btn:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-primary); }
  .layer-btn.active { background: var(--accent-dim); color: var(--accent); }

  .layer-btn.coming-soon {
    opacity: 0.35;
    cursor: default;
    pointer-events: none;
  }

  .layer-btn.coming-soon::after {
    content: 'Soon';
    font-size: 8px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-left: auto;
  }

  .layers-toggle {
    display: none;
    pointer-events: auto;
    width: 40px;
    height: 40px;
    border-radius: var(--radius);
    border: 1px solid var(--border-subtle);
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    color: var(--text-secondary);
    cursor: pointer;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all var(--transition);
    box-shadow: var(--shadow-md);
  }

  .layers-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .layers-toggle.active { background: var(--accent-dim); color: var(--accent); border-color: var(--border-active); }

  .layer-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  .layer-divider {
    height: 1px;
    background: var(--border-subtle);
    margin: 4px 8px;
  }

  /* ═══════════════════════════════════════════
     BOTTOM TIMELINE BAR
     ═══════════════════════════════════════════ */
  .timeline-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: linear-gradient(to top, var(--bg-panel) 70%, transparent);
    padding: 40px 20px 16px;
    pointer-events: none;
  }

  .timeline-inner {
    pointer-events: auto;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .timeline-label {
    position: absolute;
    top: -28px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    text-align: center;
    background: var(--bg-panel);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border-subtle);
    transform: translateX(-50%);
    white-space: nowrap;
    pointer-events: none;
  }

  .timeline-track {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .timeline-track-row {
    display: flex;
    align-items: center;
    height: 20px;
    position: relative;
  }

  .timeline-slider-unified {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: linear-gradient(to right, rgba(56, 189, 248, 0.3) 0%, rgba(56, 189, 248, 0.5) 14.3%, rgba(255, 170, 56, 0.3) 14.3%, rgba(255, 170, 56, 0.3) 100%);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    position: relative;
  }

  .timeline-slider-unified::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    cursor: grab;
    transition: transform 0.15s ease;
  }

  .timeline-slider-unified::-webkit-slider-thumb:hover {
    transform: scale(1.3);
  }

  .timeline-now-marker {
    position: absolute;
    left: 14.3%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 2px;
    height: 16px;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    pointer-events: none;
    z-index: 1;
  }

  .timeline-ticks {
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
  }

  .timeline-tick {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-muted);
    opacity: 0.6;
  }

  .timeline-tick.now {
    color: var(--accent);
    opacity: 1;
    font-weight: 600;
  }

  .timeline-tick.future {
    color: #ffaa38;
    opacity: 0.5;
  }

  .timeline-play {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border-subtle);
    background: var(--bg-panel);
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    flex-shrink: 0;
  }

  .timeline-play:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ═══════════════════════════════════════════
     POINT FORECAST DRAWER
     ═══════════════════════════════════════════ */
  .forecast-drawer {
    position: fixed;
    bottom: -400px;
    left: 16px;
    right: 16px;
    max-width: 480px;
    z-index: 150;
    background: var(--bg-panel);
    backdrop-filter: blur(24px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px;
    transition: bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow-lg);
  }

  .forecast-drawer.open { bottom: 70px; }

  .forecast-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .forecast-location {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .forecast-coords {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .forecast-close {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border-subtle);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all var(--transition);
  }

  .forecast-close:hover { border-color: var(--text-secondary); color: var(--text-primary); }

  .forecast-temp-hero {
    font-size: 48px;
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 4px;
  }

  .forecast-temp-hero span {
    font-size: 24px;
    color: var(--text-muted);
    font-weight: 400;
  }

  .forecast-condition {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }

  .forecast-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border-subtle);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }

  .forecast-stat {
    background: var(--bg-secondary);
    padding: 12px 10px;
    text-align: center;
  }

  .forecast-stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .forecast-stat-value {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
  }

  /* ═══════════════════════════════════════════
     CROSS-SECTION PANEL
     ═══════════════════════════════════════════ */
  .xsection-panel {
    position: fixed;
    bottom: -420px;
    left: 50%;
    transform: translateX(-50%);
    width: min(90vw, 800px);
    height: 360px;
    z-index: 160;
    background: var(--bg-panel);
    backdrop-filter: blur(24px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 16px 20px;
    transition: bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
  }
  .xsection-panel.open { bottom: 70px; }
  .xsection-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .xsection-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .xsection-subtitle {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    margin-left: 10px;
  }
  .xsection-close {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border-subtle);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all var(--transition);
  }
  .xsection-close:hover { border-color: var(--text-secondary); color: var(--text-primary); }
  .xsection-canvas-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  .xsection-canvas-wrap canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: var(--radius-sm);
  }
  .xsection-hint {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-active);
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 12px;
    color: var(--accent);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .xsection-hint.visible { opacity: 1; }

  /* ═══════════════════════════════════════════
     FORECAST DRAWER TABS (Sounding)
     ═══════════════════════════════════════════ */
  .forecast-tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 16px;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
    padding: 2px;
  }
  .forecast-tab {
    flex: 1;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 6px;
    transition: all var(--transition);
  }
  .forecast-tab.active {
    background: var(--accent-dim);
    color: var(--accent);
  }
  .forecast-tab-content { display: none; }
  .forecast-tab-content.active { display: block; }
  .sounding-canvas {
    width: 100%;
    height: 300px;
    display: block;
    border-radius: var(--radius-sm);
    margin-top: 8px;
  }
  .forecast-extra-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border-subtle);
    border-radius: var(--radius-sm);
    overflow: hidden;
    margin-top: 12px;
  }

  /* ═══════════════════════════════════════════
     DATA FRESHNESS BADGE
     ═══════════════════════════════════════════ */
  .freshness {
    position: fixed;
    bottom: 76px;
    right: 16px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle);
    border-radius: 20px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
  }

  .freshness-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse-dot 2s infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ═══════════════════════════════════════════
     LEGEND
     ═══════════════════════════════════════════ */
  .legend {
    position: fixed;
    left: 16px;
    bottom: 76px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0;
    transition: opacity var(--transition);
    pointer-events: none;
  }

  .legend.visible { opacity: 1; }

  .legend-gradient {
    width: 120px;
    height: 8px;
    border-radius: 4px;
  }

  .legend-gradient.radar {

  /* ═══════════════════════════════════════════

     ═══════════════════════════════════════════ */

    width: 18px;
    height: 18px;
    position: relative;

    left: 2px;

    top: 0;
    left: 0;
    z-index: 1;

     ═══════════════════════════════════════════ */

      top: 60px;
      left: 10px;
      right: auto;
      bottom: auto;

      padding: 6px;
      display: none;
      z-index: 10;

    .timeline-bar { padding: 30px 10px 10px; }
    .legend { left: 10px; bottom: 66px; }
    .freshness { bottom: 66px; right: 10px; }
  }

  /* ═══════════════════════════════════════════
     ACCESSIBILITY
     ═══════════════════════════════════════════ */
  .skip-link {
    position: fixed;
    top: -100px;
    left: 16px;
    z-index: 9999;
    padding: 8px 16px;
    background: var(--accent);
    color: var(--bg-primary);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    border-radius: var(--radius-sm);
    text-decoration: none;
    transition: top 0.2s;
  }
  .skip-link:focus {
    top: 16px;
    outline: none;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  :focus:not(:focus-visible) {
    outline: none;
  }
  .layer-btn:focus-visible,
  .timeline-play:focus-visible,
  .layers-toggle:focus-visible,
  .locate-inline:focus-visible,
  .forecast-close:focus-visible,
  .search-close:focus-visible,
  .palette-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px var(--accent-dim);
  }
  .search-input:focus-visible {

    border-color: var(--accent);

  }
  .timeline-slider-unified:focus-visible {

  }

  }

    display: block;
    width: 100%;
    height: 100%;
    border-radius: 2px;
  }
</style>
</head>

<!-- ════════════════════════════════════════════
     JAVASCRIPT
     ════════════════════════════════════════════ -->
<script>
(function() {
  'use strict';

  // ─── Map Setup ──────────────────────────────
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      name: 'Gale Dark',
      glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
      sources: {
        'carto-dark': {
          type: 'raster',
          tiles: [
            'https://a.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}@2x.png',
            'https://b.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}@2x.png',
            'https://c.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}@2x.png'
          ],
          tileSize: 256,
          attribution: '&copy; <a href="https://carto.com">CARTO</a> &copy; <a href="https://osm.org">OSM</a>'
        }
      },
      layers: [{
        id: 'carto-dark-layer',
        type: 'raster',
        source: 'carto-dark',
        minzoom: 0,
        maxzoom: 19
      }]
    },
    center: [-94.3, 46.3], // Minnesota
    zoom: 6,
    maxZoom: 12,
    minZoom: 2,
    pitch: 60,
    maxPitch: 80,
    attributionControl: true
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'bottom-right');

  // ─── Tile Base URL (Cloudflare R2) ────────────
  const TILE_BASE = 'https://pub-9975b1cfcbf9480f9e1333c7e208a6ce.r2.dev';

  // ─── HRRR Crossfade State ───────────────────
  let currentTempSourceId = 'temperature-tiles';
  let currentTempLayerId = 'temperature-layer';
  let currentTempF01SourceId = 'temperature-f01-tiles';
  let currentTempF01LayerId = 'temperature-f01-layer';
  let hrrrSwapGen = 0;
  let forecastT = 0;  // 0 = f00 (now), 1 = f01 (+1h)

  // ─── Layer State ────────────────────────────
  const layers = {
    radar: true,
    temp: true,
    wind: true,
    precip: true,
    satellite: false,
    alerts: false
  };

  // ─── Atmospheric Profile Data ──────────────
  // Binary profile.bin: 64-byte header + Int16 data
  // Grid: 281×141 at 0.25°, 6 pressure levels, 5 vars per cell
  const ATMOS = {
    W: 281, H: 141,
    LON_MIN: -130, LON_MAX: -60,
    LAT_MIN: 20, LAT_MAX: 55,
    LEVELS: [1000, 925, 850, 700, 500, 250],
    HEADER_SIZE: 64,
    VARS_PER_CELL: 5,
    data: null,       // Int16Array when loaded
    loaded: false
  };

  function loadAtmosphereProfile() {
    const url = `${TILE_BASE}/atmosphere/profile.bin`;
    fetch(url).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.arrayBuffer();
    }).then(buf => {
      const header = new DataView(buf, 0, ATMOS.HEADER_SIZE);
      const magic = String.fromCharCode(header.getUint8(0), header.getUint8(1), header.getUint8(2), header.getUint8(3));
      if (magic !== 'GALE') { console.warn('Bad atmosphere magic:', magic); return; }
      ATMOS.data = new Int16Array(buf, ATMOS.HEADER_SIZE);
      ATMOS.loaded = true;
      console.log(`Atmosphere profile loaded: ${ATMOS.data.length} values (${(buf.byteLength/1024).toFixed(0)} KB)`);
    }).catch(err => {
      console.warn('Atmosphere profile not available:', err.message);
    });
  }

  function sampleAtmosphere(lng, lat) {
    if (!ATMOS.loaded) return null;
    // Grid coords (fractional)
    const gx = (lng - ATMOS.LON_MIN) / (ATMOS.LON_MAX - ATMOS.LON_MIN) * (ATMOS.W - 1);
    const gy = (lat - ATMOS.LAT_MIN) / (ATMOS.LAT_MAX - ATMOS.LAT_MIN) * (ATMOS.H - 1);
    if (gx < 0 || gx >= ATMOS.W || gy < 0 || gy >= ATMOS.H) return null;

    // Bilinear interpolation
    const x0 = Math.floor(gx), y0 = Math.floor(gy);
    const x1 = Math.min(x0 + 1, ATMOS.W - 1), y1 = Math.min(y0 + 1, ATMOS.H - 1);
    const fx = gx - x0, fy = gy - y0;

    const cellsPerLevel = ATMOS.H * ATMOS.W * ATMOS.VARS_PER_CELL;
    const result = [];

    for (let li = 0; li < ATMOS.LEVELS.length; li++) {
      const baseOffset = li * cellsPerLevel;
      const vals = [0, 0, 0, 0, 0]; // temp, u, v, rh, hgt

      for (let vi = 0; vi < 5; vi++) {
        const v00 = ATMOS.data[baseOffset + (y0 * ATMOS.W + x0) * 5 + vi];
        const v10 = ATMOS.data[baseOffset + (y0 * ATMOS.W + x1) * 5 + vi];
        const v01 = ATMOS.data[baseOffset + (y1 * ATMOS.W + x0) * 5 + vi];
        const v11 = ATMOS.data[baseOffset + (y1 * ATMOS.W + x1) * 5 + vi];
        vals[vi] = v00 * (1 - fx) * (1 - fy) + v10 * fx * (1 - fy) +
                   v01 * (1 - fx) * fy + v11 * fx * fy;
      }

      result.push({
        pressure: ATMOS.LEVELS[li],
        tempK: vals[0] / 10,
        tempC: vals[0] / 10 - 273.15,
        uWind: vals[1] / 100,
        vWind: vals[2] / 100,
        rh: vals[3] / 100,
        hgt: vals[4]
      });
    }
    return result;
  }

  // ─── Cross-Section State ──────────────────
  let xsectionMode = false;
  let xsectionPointA = null;
  let xsectionLineSource = null;

  // ─── Screen Reader Announcements ─────────────────
  function announce(text) {
    const el = document.getElementById('srAnnounce');
    if (el) { el.textContent = ''; requestAnimationFrame(() => { el.textContent = text; }); }
  }

  // ─── Wind Particle System (WebGL) ─────────────────
  const PARTICLE_RES = window.innerWidth < 640 ? 128 : 256;
  const PARTICLE_COUNT = PARTICLE_RES * PARTICLE_RES;
  const FADE_OPACITY = window.innerWidth < 640 ? 0.993 : 0.996;
  let windParticleLayer = null;

  function glShader(gl, type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('Shader:', gl.getShaderInfoLog(s));
      gl.deleteShader(s); return null;
    }
    return s;
  }

  function glProgram(gl, vsSrc, fsSrc) {
    const vs = glShader(gl, gl.VERTEX_SHADER, vsSrc);
    const fs = glShader(gl, gl.FRAGMENT_SHADER, fsSrc);
    if (!vs || !fs) return null;
    const p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, fs);
    gl.linkProgram(p);
    gl.deleteShader(vs); gl.deleteShader(fs);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      console.error('Program:', gl.getProgramInfoLog(p)); return null;
    }
    return p;
  }

  function glTex(gl, filter) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    return t;
  }

  function glBind(gl, tex, unit) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
  }

  // GLSL shaders (GLSL ES 1.0 for max compatibility)
  const W_QUAD_VS = `
    attribute vec2 a_pos;
    varying vec2 v_tex;
    void main() {
      v_tex = a_pos * 0.5 + 0.5;
      gl_Position = vec4(a_pos, 0, 1);
    }`;

  const W_UPDATE_FS = `
    precision highp float;
    uniform sampler2D u_particles;
    uniform sampler2D u_wind_u;
    uniform sampler2D u_wind_v;
    uniform vec2 u_wind_min;
    uniform vec2 u_wind_max;
    uniform float u_speed_factor;
    uniform float u_drop_rate;
    uniform float u_drop_rate_bump;
    uniform float u_rand_seed;
    varying vec2 v_tex;

    float rand(vec2 co) {
      return fract(sin(dot(co + u_rand_seed, vec2(12.9898, 78.233))) * 43758.5453);
    }
    vec2 decode(vec4 c) { return vec2(c.r + c.g / 255.0, c.b + c.a / 255.0); }
    vec4 encode(vec2 p) {
      return vec4(floor(p.x*255.0)/255.0, fract(p.x*255.0),
                  floor(p.y*255.0)/255.0, fract(p.y*255.0));
    }
    void main() {
      vec2 pos = decode(texture2D(u_particles, v_tex));
      vec2 uv = (pos - u_wind_min) / (u_wind_max - u_wind_min);
      vec2 wind = vec2(0.0);
      if (uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) {
        float u = texture2D(u_wind_u, uv).r * 80.0 - 40.0;
        float v = texture2D(u_wind_v, uv).r * 80.0 - 40.0;
        wind = vec2(u, -v);
      }
      float spd = length(wind);
      vec2 npos = pos + wind * u_speed_factor;
      float drop = u_drop_rate + spd * u_drop_rate_bump;
      vec2 seed = pos + u_rand_seed;
      vec2 respawn = vec2(
        u_wind_min.x + rand(seed + 1.3) * (u_wind_max.x - u_wind_min.x),
        u_wind_min.y + rand(seed + 2.1) * (u_wind_max.y - u_wind_min.y));
      bool oob = npos.x < u_wind_min.x || npos.x > u_wind_max.x ||
                 npos.y < u_wind_min.y || npos.y > u_wind_max.y;
      gl_FragColor = encode((rand(seed) < drop || oob) ? respawn : npos);
    }`;

  const W_DRAW_VS = `
    precision highp float;
    attribute float a_index;
    uniform sampler2D u_particles;
    uniform sampler2D u_wind_u;
    uniform sampler2D u_wind_v;
    uniform float u_particles_res;
    uniform vec2 u_wind_min;
    uniform vec2 u_wind_max;
    uniform mat4 u_matrix;
    varying float v_speed;
    vec2 decode(vec4 c) { return vec2(c.r + c.g / 255.0, c.b + c.a / 255.0); }
    void main() {
      float y = floor(a_index / u_particles_res);
      float x = a_index - y * u_particles_res;
      vec2 uv = (vec2(x, y) + 0.5) / u_particles_res;
      vec2 pos = decode(texture2D(u_particles, uv));
      vec2 wuv = (pos - u_wind_min) / (u_wind_max - u_wind_min);
      v_speed = 0.0;
      if (wuv.x >= 0.0 && wuv.x <= 1.0 && wuv.y >= 0.0 && wuv.y <= 1.0) {
        float u = texture2D(u_wind_u, wuv).r * 80.0 - 40.0;
        float v = texture2D(u_wind_v, wuv).r * 80.0 - 40.0;
        v_speed = length(vec2(u, v));
      }
      gl_Position = u_matrix * vec4(pos, 0.0, 1.0);
      gl_PointSize = 1.0;
    }`;

  const W_DRAW_FS = `
    precision mediump float;
    uniform sampler2D u_color_ramp;
    varying float v_speed;
    void main() {
      float t = clamp(v_speed / 40.0, 0.0, 1.0);
      gl_FragColor = texture2D(u_color_ramp, vec2(t, 0.5));
    }`;

  const W_SCREEN_FS = `
    precision mediump float;
    uniform sampler2D u_screen;
    uniform float u_opacity;
    varying vec2 v_tex;
    void main() {
      vec4 c = texture2D(u_screen, v_tex);
      gl_FragColor = vec4(c.rgb, c.a * u_opacity);
    }`;

  function createWindParticleLayer() {
    let windLoaded = false, cameraMoving = false;
    let upProg, drProg, scProg;
    let wuTex, wvTex, crTex, pTex0, pTex1, sTex0, sTex1;
    let qBuf, iBuf, fbo;
    let pIdx = 0, sIdx = 0, mapR, glR, cw = 0, ch = 0;
    const WB = { x0: 1/8, y0: 2/8, x1: 3/8, y1: 4/8 };

    function loadWind(gl) {
      const tiles = [{x:1,y:2},{x:2,y:2},{x:1,y:3},{x:2,y:3}];
      const can = document.createElement('canvas');
      can.width = 512; can.height = 512;
      const cx = can.getContext('2d');
      function stitch(layer) {
        return new Promise(res => {
          let n = 0; const imgs = [];
          tiles.forEach((c, i) => {
            const img = new Image(); img.crossOrigin = 'anonymous';
            img.onload = () => { imgs[i] = img; if (++n === 4) finish(); };
            img.onerror = () => { imgs[i] = null; if (++n === 4) finish(); };
            img.src = `${TILE_BASE}/${layer}/3/${c.x}/${c.y}.png`;
          });
          function finish() {
            if (imgs.some(v => !v)) { res(null); return; }
            cx.clearRect(0, 0, 512, 512);
            cx.drawImage(imgs[0], 0, 0);     cx.drawImage(imgs[1], 256, 0);
            cx.drawImage(imgs[2], 0, 256);   cx.drawImage(imgs[3], 256, 256);
            res(cx.getImageData(0, 0, 512, 512));
          }
        });
      }
      Promise.all([stitch('wind-u'), stitch('wind-v')]).then(([uD, vD]) => {
        if (!uD || !vD) { console.warn('Wind particles: U/V tiles not available'); return; }
        gl.bindTexture(gl.TEXTURE_2D, wuTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 512, 512, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(uD.data.buffer));
        gl.bindTexture(gl.TEXTURE_2D, wvTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 512, 512, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(vD.data.buffer));
        windLoaded = true;
        if (mapR) mapR.triggerRepaint();
      });
    }

    function makeRamp(gl) {
      const px = new Uint8Array(256 * 4);
      for (let i = 0; i < 256; i++) {
        const s = (i / 255) * 40;
        let r = 0, g = 0, b = 0, a = 255;
        for (let j = 0; j < WIND_RAMP.length - 1; j++) {
          if (s >= WIND_RAMP[j].v && s <= WIND_RAMP[j+1].v) {
            const t = (s - WIND_RAMP[j].v) / (WIND_RAMP[j+1].v - WIND_RAMP[j].v);
            r = WIND_RAMP[j].r + t * (WIND_RAMP[j+1].r - WIND_RAMP[j].r);
            g = WIND_RAMP[j].g + t * (WIND_RAMP[j+1].g - WIND_RAMP[j].g);
            b = WIND_RAMP[j].b + t * (WIND_RAMP[j+1].b - WIND_RAMP[j].b);
            break;
          }
        }
        if (s >= WIND_RAMP[WIND_RAMP.length-1].v) {
          r = WIND_RAMP[WIND_RAMP.length-1].r;
          g = WIND_RAMP[WIND_RAMP.length-1].g;
          b = WIND_RAMP[WIND_RAMP.length-1].b;
        }
        if (s < 1) a = Math.round(s * 255);
        px[i*4]=Math.round(r); px[i*4+1]=Math.round(g);
        px[i*4+2]=Math.round(b); px[i*4+3]=a;
      }
      gl.bindTexture(gl.TEXTURE_2D, crTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
    }

    function initParticles(gl) {
      const d = new Uint8Array(PARTICLE_COUNT * 4);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const x = WB.x0 + Math.random() * (WB.x1 - WB.x0);
        const y = WB.y0 + Math.random() * (WB.y1 - WB.y0);
        const xs = x * 255, ys = y * 255;
        d[i*4]   = Math.floor(xs);
        d[i*4+1] = Math.round((xs % 1) * 255);
        d[i*4+2] = Math.floor(ys);
        d[i*4+3] = Math.round((ys % 1) * 255);
      }
      gl.bindTexture(gl.TEXTURE_2D, pTex0);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, PARTICLE_RES, PARTICLE_RES, 0, gl.RGBA, gl.UNSIGNED_BYTE, d);
      gl.bindTexture(gl.TEXTURE_2D, pTex1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, PARTICLE_RES, PARTICLE_RES, 0, gl.RGBA, gl.UNSIGNED_BYTE, d);
    }

    function resizeScreen(gl) {
      const w = gl.canvas.width, h = gl.canvas.height;
      if (w === cw && h === ch) return;
      cw = w; ch = h;
      const empty = new Uint8Array(w * h * 4);
      gl.bindTexture(gl.TEXTURE_2D, sTex0);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, empty);
      gl.bindTexture(gl.TEXTURE_2D, sTex1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, empty);
    }

    function clearTrails() {
      if (!glR) return;
      const gl = glR, w = gl.canvas.width, h = gl.canvas.height;
      const empty = new Uint8Array(w * h * 4);
      gl.bindTexture(gl.TEXTURE_2D, sTex0);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, empty);
      gl.bindTexture(gl.TEXTURE_2D, sTex1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, empty);
      sIdx = 0;
    }

    function drawQuad(gl, prog) {
      const loc = gl.getAttribLocation(prog, 'a_pos');
      gl.bindBuffer(gl.ARRAY_BUFFER, qBuf);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.disableVertexAttribArray(loc);
    }

    return {
      id: 'wind-particles',
      type: 'custom',
      renderingMode: '3d',

      onAdd(map, gl) {
        mapR = map; glR = gl;
        upProg = glProgram(gl, W_QUAD_VS, W_UPDATE_FS);
        drProg = glProgram(gl, W_DRAW_VS, W_DRAW_FS);
        scProg = glProgram(gl, W_QUAD_VS, W_SCREEN_FS);
        if (!upProg || !drProg || !scProg) return;

        wuTex = glTex(gl, gl.LINEAR);  wvTex = glTex(gl, gl.LINEAR);
        crTex = glTex(gl, gl.LINEAR);
        pTex0 = glTex(gl, gl.NEAREST); pTex1 = glTex(gl, gl.NEAREST);
        sTex0 = glTex(gl, gl.LINEAR);  sTex1 = glTex(gl, gl.LINEAR);
        fbo = gl.createFramebuffer();

        qBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, qBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

        const idx = new Float32Array(PARTICLE_COUNT);
        for (let i = 0; i < PARTICLE_COUNT; i++) idx[i] = i;
        iBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, iBuf);
        gl.bufferData(gl.ARRAY_BUFFER, idx, gl.STATIC_DRAW);

        makeRamp(gl); initParticles(gl);

        map.on('movestart', () => { cameraMoving = true; });
        map.on('moveend', () => {
          cameraMoving = false; clearTrails();
          map.triggerRepaint();
        });

        loadWind(gl);
      },

      render(gl, matrix) {
        if (!layers.wind || !windLoaded || !upProg) return;
        resizeScreen(gl);

        // Save MapLibre GL state
        const prevFBO = gl.getParameter(gl.FRAMEBUFFER_BINDING);
        const prevBlend = gl.isEnabled(gl.BLEND);
        const prevDepth = gl.isEnabled(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);

        // Pass 1: Update particle positions
        gl.useProgram(upProg);
        const curP = pIdx === 0 ? pTex0 : pTex1;
        const nxtP = pIdx === 0 ? pTex1 : pTex0;
        glBind(gl, curP, 0);
        gl.uniform1i(gl.getUniformLocation(upProg, 'u_particles'), 0);
        glBind(gl, wuTex, 1);
        gl.uniform1i(gl.getUniformLocation(upProg, 'u_wind_u'), 1);
        glBind(gl, wvTex, 2);
        gl.uniform1i(gl.getUniformLocation(upProg, 'u_wind_v'), 2);
        gl.uniform2f(gl.getUniformLocation(upProg, 'u_wind_min'), WB.x0, WB.y0);
        gl.uniform2f(gl.getUniformLocation(upProg, 'u_wind_max'), WB.x1, WB.y1);
        gl.uniform1f(gl.getUniformLocation(upProg, 'u_speed_factor'), 0.000025);
        gl.uniform1f(gl.getUniformLocation(upProg, 'u_drop_rate'), 0.003);
        gl.uniform1f(gl.getUniformLocation(upProg, 'u_drop_rate_bump'), 0.00015);
        gl.uniform1f(gl.getUniformLocation(upProg, 'u_rand_seed'), Math.random());

        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, nxtP, 0);
        gl.viewport(0, 0, PARTICLE_RES, PARTICLE_RES);
        gl.disable(gl.BLEND);
        drawQuad(gl, upProg);
        pIdx = 1 - pIdx;

        // Pass 2: Fade previous trail
        const curS = sIdx === 0 ? sTex0 : sTex1;
        const nxtS = sIdx === 0 ? sTex1 : sTex0;
        gl.useProgram(scProg);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, nxtS, 0);
        gl.viewport(0, 0, cw, ch);
        glBind(gl, curS, 0);
        gl.uniform1i(gl.getUniformLocation(scProg, 'u_screen'), 0);
        gl.uniform1f(gl.getUniformLocation(scProg, 'u_opacity'), cameraMoving ? 0.0 : FADE_OPACITY);
        drawQuad(gl, scProg);

        // Pass 3: Draw particles onto faded trail
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(drProg);
        const updP = pIdx === 0 ? pTex0 : pTex1;
        glBind(gl, updP, 0);
        gl.uniform1i(gl.getUniformLocation(drProg, 'u_particles'), 0);
        glBind(gl, wuTex, 1);
        gl.uniform1i(gl.getUniformLocation(drProg, 'u_wind_u'), 1);
        glBind(gl, wvTex, 2);
        gl.uniform1i(gl.getUniformLocation(drProg, 'u_wind_v'), 2);
        glBind(gl, crTex, 3);
        gl.uniform1i(gl.getUniformLocation(drProg, 'u_color_ramp'), 3);
        gl.uniform1f(gl.getUniformLocation(drProg, 'u_particles_res'), PARTICLE_RES);
        gl.uniform2f(gl.getUniformLocation(drProg, 'u_wind_min'), WB.x0, WB.y0);
        gl.uniform2f(gl.getUniformLocation(drProg, 'u_wind_max'), WB.x1, WB.y1);
        gl.uniformMatrix4fv(gl.getUniformLocation(drProg, 'u_matrix'), false, new Float32Array(matrix));

        const aIdx = gl.getAttribLocation(drProg, 'a_index');
        gl.bindBuffer(gl.ARRAY_BUFFER, iBuf);
        gl.enableVertexAttribArray(aIdx);
        gl.vertexAttribPointer(aIdx, 1, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);
        gl.disableVertexAttribArray(aIdx);

        // Pass 4: Composite onto MapLibre's framebuffer
        gl.bindFramebuffer(gl.FRAMEBUFFER, prevFBO);
        gl.viewport(0, 0, cw, ch);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.useProgram(scProg);
        glBind(gl, nxtS, 0);
        gl.uniform1i(gl.getUniformLocation(scProg, 'u_screen'), 0);
        gl.uniform1f(gl.getUniformLocation(scProg, 'u_opacity'), 1.0);
        drawQuad(gl, scProg);

        sIdx = 1 - sIdx;

        // Restore MapLibre GL state
        if (prevDepth) gl.enable(gl.DEPTH_TEST); else gl.disable(gl.DEPTH_TEST);
        if (prevBlend) gl.enable(gl.BLEND); else gl.disable(gl.BLEND);

        map.triggerRepaint();
      },

      onRemove(map, gl) {
        [wuTex, wvTex, crTex, pTex0, pTex1, sTex0, sTex1].forEach(t => t && gl.deleteTexture(t));
        [qBuf, iBuf].forEach(b => b && gl.deleteBuffer(b));
        [upProg, drProg, scProg].forEach(p => p && gl.deleteProgram(p));
        if (fbo) gl.deleteFramebuffer(fbo);
      },

      reloadWind() {
        if (glR) { windLoaded = false; loadWind(glR); }
      }
    };
  }

  // ─── Add Map Layers (order matters: bottom → top) ───
  map.on('load', () => {
    // 3D Terrain — DEM tiles for real elevation
    map.addSource('dem', {
      type: 'raster-dem',
      tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      tileSize: 256,
      maxzoom: 15,
      encoding: 'terrarium'
    });
    map.setTerrain({ source: 'dem', exaggeration: 1.5 });

    // Temperature color wash — HRRR tiles from R2 (renders below radar)
    map.addSource('temperature-tiles', {
      type: 'raster',
      tiles: [`${TILE_BASE}/temperature/{z}/{x}/{y}.png`],
      tileSize: 256,
      maxzoom: 6
    });

    map.addLayer({
      id: 'temperature-layer',
      type: 'raster',
      source: 'temperature-tiles',
      paint: {
        'raster-opacity': 0.7,
        'raster-fade-duration': 300
      }
    });

    // Temperature +1h forecast overlay (f01, starts hidden at opacity 0)
    map.addSource('temperature-f01-tiles', {
      type: 'raster',
      tiles: [`${TILE_BASE}/temperature-f01/{z}/{x}/{y}.png`],
      tileSize: 256,
      maxzoom: 6
    });

    map.addLayer({
      id: 'temperature-f01-layer',
      type: 'raster',
      source: 'temperature-f01-tiles',
      paint: {
        'raster-opacity': 0,
        'raster-fade-duration': 300
      },
      layout: { visibility: layers.temp ? 'visible' : 'none' }
    });

    // MRMS Radar — Iowa State Mesonet (renders on top of temperature/wind/precip)
    map.addSource('radar', {
      type: 'raster',
      tiles: [
        'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png'
      ],
      tileSize: 256,
      attribution: '&copy; <a href="https://mesonet.agron.iastate.edu">Iowa State Mesonet</a>'
    });

    map.addLayer({
      id: 'radar-layer',
      type: 'raster',
      source: 'radar',
      paint: {
        'raster-opacity': 0.7,
        'raster-fade-duration': 300
      }
    });

    // HRRR Precipitation forecast overlay (futurecast radar)
    map.addSource('precip-forecast', {
      type: 'raster',
      tiles: [`${TILE_BASE}/precipitation/{z}/{x}/{y}.png`],
      tileSize: 256,
      maxzoom: 6
    });

    map.addLayer({
      id: 'precip-forecast-layer',
      type: 'raster',
      source: 'precip-forecast',
      paint: {
        'raster-opacity': 0,
        'raster-fade-duration': 0
      },
      layout: { visibility: 'visible' }
    });

    // Satellite — GOES visible via Iowa State Mesonet
    map.addSource('satellite', {
      type: 'raster',
      tiles: [
        'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/goes-vis-1km-900913/{z}/{x}/{y}.png'

      const size = 48;

      const rainCanvas = document.createElement('canvas');

      const rc = rainCanvas.getContext('2d');
      rc.beginPath();
      rc.moveTo(24, 6);

      rc.bezierCurveTo(10, 38, 17, 44, 24, 44);
      rc.bezierCurveTo(31, 44, 38, 38, 38, 30);
      rc.bezierCurveTo(38, 24, 24, 6, 24, 6);
      rc.closePath();
      rc.fillStyle = 'rgba(96, 165, 250, 0.85)';
      rc.fill();
      rc.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      rc.lineWidth = 2;
      rc.stroke();
      map.addImage('precip-rain', { width: size, height: size, data: rc.getImageData(0, 0, size, size).data });

      // Snowflake (6-armed with branches)
      const snowCanvas = document.createElement('canvas');
      snowCanvas.width = size; snowCanvas.height = size;
      const sc = snowCanvas.getContext('2d');
      const cx = 24, cy = 24, armLen = 16, branchLen = 6;
      sc.strokeStyle = 'rgba(255, 255, 255, 0.95)';
      sc.lineWidth = 2;
      sc.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const angle = (i * 60) * Math.PI / 180;
        const ex = cx + Math.cos(angle) * armLen;
        const ey = cy + Math.sin(angle) * armLen;
        // Main arm
        sc.beginPath();
        sc.moveTo(cx, cy);
        sc.lineTo(ex, ey);
        sc.stroke();
        // Branch left
        const mid = 0.6;
        const mx = cx + Math.cos(angle) * armLen * mid;
        const my = cy + Math.sin(angle) * armLen * mid;
        const bAngleL = angle + Math.PI / 4;
        const bAngleR = angle - Math.PI / 4;
        sc.beginPath();
        sc.moveTo(mx, my);
        sc.lineTo(mx + Math.cos(bAngleL) * branchLen, my + Math.sin(bAngleL) * branchLen);
        sc.stroke();
        // Branch right
        sc.beginPath();
        sc.moveTo(mx, my);
        sc.lineTo(mx + Math.cos(bAngleR) * branchLen, my + Math.sin(bAngleR) * branchLen);
        sc.stroke();
      }
      map.addImage('precip-snow', { width: size, height: size, data: sc.getImageData(0, 0, size, size).data });
