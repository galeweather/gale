  // ─── Temperature Labels (sampled from tile pixels) ───
  // Color ramp: Celsius → RGBA (must match temperature_ramp.txt)
  const TEMP_RAMP = [
    { c: -40, r: 30,  g: 58,  b: 95  },
    { c: -29, r: 37,  g: 99,  b: 235 },
    { c: -18, r: 6,   g: 182, b: 212 },
    { c: -7,  r: 16,  g: 185, b: 129 },
    { c: 5,   r: 132, g: 204, b: 22  },
    { c: 16,  r: 234, g: 179, b: 8   },
    { c: 27,  r: 249, g: 115, b: 22  },
    { c: 38,  r: 239, g: 68,  b: 68  },
    { c: 49,  r: 153, g: 27,  b: 27  },
  ];

  // Wind speed ramp: m/s → RGBA (must match wind_ramp.txt)
  const WIND_RAMP = [
    { v: 0,  r: 0,   g: 0,   b: 0   },
    { v: 1,  r: 200, g: 230, b: 255 },
    { v: 5,  r: 100, g: 180, b: 255 },
    { v: 10, r: 50,  g: 120, b: 230 },
    { v: 15, r: 50,  g: 200, b: 100 },
    { v: 20, r: 230, g: 230, b: 50  },
    { v: 25, r: 230, g: 150, b: 30  },
    { v: 30, r: 230, g: 80,  b: 30  },
    { v: 35, r: 200, g: 30,  b: 30  },
    { v: 40, r: 150, g: 0,   b: 80  },
  ];

  // Precip ramp: mm → RGBA (must match precip_ramp.txt)
  const PRECIP_RAMP = [
    { v: 0,   r: 0,   g: 0,   b: 0   },
    { v: 0.1, r: 170, g: 220, b: 170 },
    { v: 1,   r: 100, g: 200, b: 100 },
    { v: 5,   r: 50,  g: 180, b: 50  },
    { v: 10,  r: 50,  g: 150, b: 255 },
    { v: 15,  r: 30,  g: 100, b: 230 },
    { v: 25,  r: 200, g: 200, b: 50  },
    { v: 35,  r: 230, g: 130, b: 30  },
    { v: 50,  r: 200, g: 30,  b: 50  },
  ];

  // Generic reverse-ramp: RGB pixel → physical value
  function reverseRamp(r, g, b, ramp, valKey) {
    let bestVal = null, bestError = Infinity;

    for (let i = 0; i < ramp.length - 1; i++) {
      const a = ramp[i], n = ramp[i + 1];
      const dr = n.r - a.r, dg = n.g - a.g, db = n.b - a.b;

      const tVals = [];
      if (Math.abs(dr) > 2) tVals.push((r - a.r) / dr);
      if (Math.abs(dg) > 2) tVals.push((g - a.g) / dg);
      if (Math.abs(db) > 2) tVals.push((b - a.b) / db);
      if (tVals.length === 0) continue;

      const avgT = tVals.reduce((s, v) => s + v, 0) / tVals.length;
      const maxDev = Math.max(...tVals.map(t => Math.abs(t - avgT)));
      if (avgT < -0.1 || avgT > 1.1 || maxDev > 0.2) continue;

      const t = Math.max(0, Math.min(1, avgT));
      const er = a.r + t * dr, eg = a.g + t * dg, eb = a.b + t * db;
      const error = (r - er) ** 2 + (g - eg) ** 2 + (b - eb) ** 2;

      if (error < bestError) {
        bestError = error;
        bestVal = a[valKey] + t * (n[valKey] - a[valKey]);
      }
    }

    if (bestVal === null) {
      let bestIdx = 0, bestDist = Infinity;
      for (let i = 0; i < ramp.length; i++) {
        const d = (r - ramp[i].r) ** 2 + (g - ramp[i].g) ** 2 + (b - ramp[i].b) ** 2;
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      bestVal = ramp[bestIdx][valKey];
    }

    return bestVal;
  }

  function rgbToTempF(r, g, b) {
    const celsius = reverseRamp(r, g, b, TEMP_RAMP, 'c');
    return Math.round(celsius * 9 / 5 + 32);
  }

  function rgbToWindMph(r, g, b) {
    const ms = reverseRamp(r, g, b, WIND_RAMP, 'v');
    return Math.round(ms * 2.237);
  }

  function rgbToPrecipIn(r, g, b) {
    const mm = reverseRamp(r, g, b, PRECIP_RAMP, 'v');
    return +(mm * 0.03937).toFixed(2);
  }

  function rgbToWindDir(r, g, b) {
    return r * 360 / 255;
  }

  // Tile pixel reading via offscreen canvas
  const tileCache = {};
  const offCanvas = document.createElement('canvas');
  offCanvas.width = 256; offCanvas.height = 256;
  const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

  function lngLatToTile(lng, lat, zoom) {
    const x = Math.floor((lng + 180) / 360 * (1 << zoom));
    const latRad = lat * Math.PI / 180;
    const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1/Math.cos(latRad)) / Math.PI) / 2 * (1 << zoom));
    return { x, y, z: zoom };
  }

  function lngLatToPixelInTile(lng, lat, z, tx, ty) {
    const n = 1 << z;
    const px = ((lng + 180) / 360 * n - tx) * 256;
    const latRad = lat * Math.PI / 180;
    const py = ((1 - Math.log(Math.tan(latRad) + 1/Math.cos(latRad)) / Math.PI) / 2 * n - ty) * 256;
    return { px: Math.floor(px), py: Math.floor(py) };
  }

  function sampleTileAt(lng, lat, layerName) {
    const layerPath = layerName || 'temperature';
    const converter = layerPath === 'wind' ? rgbToWindMph
                    : layerPath === 'precipitation' ? rgbToPrecipIn
                    : layerPath === 'wind-direction' ? rgbToWindDir
                    : rgbToTempF;  // covers 'temperature' and 'temperature-f01'

    return new Promise((resolve) => {
      const z = Math.min(Math.floor(map.getZoom()), 6);
      if (z < 2) { resolve(null); return; }
      const { x, y } = lngLatToTile(lng, lat, z);
      const { px, py } = lngLatToPixelInTile(lng, lat, z, x, y);
      if (px < 0 || px > 255 || py < 0 || py > 255) { resolve(null); return; }

      const tileUrl = `${TILE_BASE}/${layerPath}/${z}/${x}/${y}.png`;
      const cached = tileCache[tileUrl];
      if (cached) {
        offCtx.clearRect(0, 0, 256, 256);
        offCtx.drawImage(cached, 0, 0);
        const d = offCtx.getImageData(px, py, 1, 1).data;
        resolve(d[3] > 50 ? converter(d[0], d[1], d[2]) : null);
        return;
      }

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        tileCache[tileUrl] = img;
        offCtx.clearRect(0, 0, 256, 256);
        offCtx.drawImage(img, 0, 0);
        const d = offCtx.getImageData(px, py, 1, 1).data;
        resolve(d[3] > 50 ? converter(d[0], d[1], d[2]) : null);
      };
      img.onerror = () => resolve(null);
      img.src = tileUrl;
    });
  }

  let tempLabelGen = 0;
  async function updateTempLabels() {
    if (!layers.temp) return;
    const gen = ++tempLabelGen;
    const bounds = map.getBounds();
    const west = bounds.getWest(), east = bounds.getEast();
    const north = bounds.getNorth(), south = bounds.getSouth();
    const cols = 5, rows = 4;
    const lngStep = (east - west) / cols;
    const latStep = (north - south) / rows;

    const features = [];
    const promises = [];
    for (let row = 0.3; row < rows; row++) {
      for (let col = 0.3; col < cols; col++) {
        const lng = west + col * lngStep;
        const lat = south + row * latStep;
        const samplePromise = forecastT > 0
          ? Promise.all([
              sampleTileAt(lng, lat, 'temperature'),
              sampleTileAt(lng, lat, 'temperature-f01')
            ]).then(([f00, f01]) => {
              if (f00 !== null) {
                const val = f01 !== null ? Math.round(f00 * (1 - forecastT) + f01 * forecastT) : f00;
                features.push({
                  type: 'Feature',
                  geometry: { type: 'Point', coordinates: [lng, lat] },
                  properties: { label: `${val}°F` }
                });
              }
            })
          : sampleTileAt(lng, lat, 'temperature').then(tempF => {
              if (tempF !== null) {
                features.push({
                  type: 'Feature',
                  geometry: { type: 'Point', coordinates: [lng, lat] },
                  properties: { label: `${tempF}°F` }
                });
              }
            });
        promises.push(samplePromise);
      }
    }
    await Promise.all(promises);
    if (gen !== tempLabelGen) return; // stale — newer update in flight
    if (map.getSource('temp-labels')) {
      map.getSource('temp-labels').setData({ type: 'FeatureCollection', features });
    }
  }

  let windLabelGen = 0;
  async function updateWindLabels() {
    if (!layers.wind) return;
    const gen = ++windLabelGen;
    const bounds = map.getBounds();
    const west = bounds.getWest(), east = bounds.getEast();
    const north = bounds.getNorth(), south = bounds.getSouth();
    const cols = 4, rows = 3;
    const lngStep = (east - west) / cols;
    const latStep = (north - south) / rows;

    const features = [];
    const promises = [];
    for (let row = 0.7; row < rows; row++) {
      for (let col = 0.7; col < cols; col++) {
        const lng = west + col * lngStep;
        const lat = south + row * latStep;
        promises.push(
          Promise.all([
            sampleTileAt(lng, lat, 'wind'),
            sampleTileAt(lng, lat, 'wind-direction')
          ]).then(([mph, dir]) => {
            if (mph !== null && mph > 1) {
              features.push({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [lng, lat] },
                properties: { label: `${mph} mph`, direction: dir ?? 0 }
              });
            }
          })
        );
      }
    }
    await Promise.all(promises);
    if (gen !== windLabelGen) return;
    if (map.getSource('wind-labels')) {
      map.getSource('wind-labels').setData({ type: 'FeatureCollection', features });
    }
  }

  let precipLabelGen = 0;
  async function updatePrecipLabels() {
    if (!layers.precip) return;
    const gen = ++precipLabelGen;
    const bounds = map.getBounds();
    const west = bounds.getWest(), east = bounds.getEast();
    const north = bounds.getNorth(), south = bounds.getSouth();
    const cols = 8, rows = 6;
    const lngStep = (east - west) / cols;
    const latStep = (north - south) / rows;

    const features = [];
    const promises = [];
    for (let row = 0.5; row < rows; row++) {
      for (let col = 0.5; col < cols; col++) {
        const lng = west + col * lngStep;
        const lat = south + row * latStep;
        promises.push(
          Promise.all([
            sampleTileAt(lng, lat, 'precipitation'),
            sampleTileAt(lng, lat, 'temperature')
          ]).then(([inches, tempF]) => {
            if (inches !== null && inches > 0) {
              const type = (tempF !== null && tempF <= 32) ? 'snow' : 'rain';
              const label = inches < 0.01 ? 'Trace' : `${inches}"`;
              features.push({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [lng, lat] },
                properties: { label, type }
              });
            }
          })
        );
      }
    }
    await Promise.all(promises);
    if (gen !== precipLabelGen) return;
    if (map.getSource('precip-labels')) {
      map.getSource('precip-labels').setData({ type: 'FeatureCollection', features });
    }
  }

  function updateAllLabels() {
    updateTempLabels();
    updateWindLabels();
    updatePrecipLabels();
  }

  let labelDebounce = null;
  function debouncedUpdateLabels() {
    clearTimeout(labelDebounce);
    labelDebounce = setTimeout(updateAllLabels, 300);
  }
  map.on('moveend', debouncedUpdateLabels);
  map.on('zoomend', debouncedUpdateLabels);
  setTimeout(updateAllLabels, 2000); // initial load

  // ─── Fetch NWS Alerts ───────────────────────
  async function fetchAlerts() {
    try {
      const resp = await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert');
      const data = await resp.json();
      if (map.getSource('alerts')) {
        map.getSource('alerts').setData(data);
      }
    } catch (e) {
      console.warn('Failed to fetch NWS alerts:', e);
    }
  }

  // ─── Radar Auto-Refresh ─────────────────────
  setInterval(() => {
    if (layers.radar && map.getSource('radar')) {
      // Force tile refresh by updating source tiles with cache-bust
      const ts = Date.now();
      map.getSource('radar').setTiles([
        `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png?_=${ts}`
      ]);
      document.getElementById('freshnessText').textContent = `MRMS ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
    }
  }, 120000); // 2 minutes

  // ─── Service Worker (persistent tile cache + offline) ─────
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // ─── Smart HRRR Freshness (skip network when no new data exists) ─────
  let lastTempRun = '';

  // Restore last known run from localStorage (instant display, no network)
  const storedHrrr = JSON.parse(localStorage.getItem('gale_hrrr') || 'null');
  if (storedHrrr) {
    lastTempRun = storedHrrr.run;
    document.getElementById('freshnessText').textContent =
      `HRRR ${storedHrrr.hour}Z · MRMS live`;
  }

  function applyForecastInterpolation() {
    const baseOpacity = layers.radar ? 0.25 : 0.7;
    const f00Opacity = baseOpacity * (1 - forecastT);
    const f01Opacity = baseOpacity * forecastT;
    if (map.getLayer(currentTempLayerId)) {
      map.setPaintProperty(currentTempLayerId, 'raster-opacity', f00Opacity);
    }
    if (map.getLayer(currentTempF01LayerId)) {
      map.setPaintProperty(currentTempF01LayerId, 'raster-opacity', f01Opacity);
    }
  }

  function nextHrrrAvailable() {
    // HRRR publishes hourly, available ~20 min after the hour.
    // Given the last known run, calculate when a newer one might exist.
    if (!storedHrrr) return 0; // No stored data — check immediately
    const d = storedHrrr.date; // "20260217"
    const h = parseInt(storedHrrr.hour, 10);
    const yr = parseInt(d.slice(0,4)), mo = parseInt(d.slice(4,6)) - 1, dy = parseInt(d.slice(6,8));
    // Next run = lastHour + 1, available at :22 (2 min buffer)
    return Date.UTC(yr, mo, dy, h + 1, 22, 0);
  }

  function crossfadeTemperature(ts) {
    const gen = ++hrrrSwapGen;

    // ── f00 crossfade ──
    const oldSourceId = currentTempSourceId;
    const oldLayerId = currentTempLayerId;
    const newSourceId = `temperature-tiles-${gen}`;
    const newLayerId = `temperature-layer-${gen}`;

    map.addSource(newSourceId, {
      type: 'raster',
      tiles: [`${TILE_BASE}/temperature/{z}/{x}/{y}.png?_=${ts}`],
      tileSize: 256,
      maxzoom: 6
    });

    map.addLayer({
      id: newLayerId,
      type: 'raster',
      source: newSourceId,
      paint: {
        'raster-opacity': 0,
        'raster-fade-duration': 0
      },
      layout: { visibility: layers.temp ? 'visible' : 'none' }
    }, 'radar-layer');

    currentTempSourceId = newSourceId;
    currentTempLayerId = newLayerId;

    // ── f01 crossfade ──
    const oldF01SourceId = currentTempF01SourceId;
    const oldF01LayerId = currentTempF01LayerId;
    const newF01SourceId = `temperature-f01-tiles-${gen}`;
    const newF01LayerId = `temperature-f01-layer-${gen}`;

    map.addSource(newF01SourceId, {
      type: 'raster',
      tiles: [`${TILE_BASE}/temperature-f01/{z}/{x}/{y}.png?_=${ts}`],
      tileSize: 256,
      maxzoom: 6
    });

    map.addLayer({
      id: newF01LayerId,
      type: 'raster',
      source: newF01SourceId,
      paint: {
        'raster-opacity': 0,
        'raster-fade-duration': 0
      },
      layout: { visibility: layers.temp ? 'visible' : 'none' }
    }, 'radar-layer');

    currentTempF01SourceId = newF01SourceId;
    currentTempF01LayerId = newF01LayerId;

    // Once tiles load, crossfade both layers
    map.once('idle', () => {
      if (hrrrSwapGen !== gen) return; // superseded
      // Apply interpolation-aware opacities
      applyForecastInterpolation();
      // Fade old f00 out
      if (map.getLayer(oldLayerId)) {
        map.setPaintProperty(oldLayerId, 'raster-opacity', 0);
      }
      // Fade old f01 out
      if (map.getLayer(oldF01LayerId)) {
        map.setPaintProperty(oldF01LayerId, 'raster-opacity', 0);
      }
      // Clean up old after transition
      setTimeout(() => {
        if (map.getLayer(oldLayerId)) map.removeLayer(oldLayerId);
        if (map.getSource(oldSourceId)) map.removeSource(oldSourceId);
        if (map.getLayer(oldF01LayerId)) map.removeLayer(oldF01LayerId);
        if (map.getSource(oldF01SourceId)) map.removeSource(oldF01SourceId);
      }, 800);
    });
  }

  async function checkTempFreshness() {
    // Smart skip: don't hit the network if no new HRRR run can exist yet
    if (Date.now() < nextHrrrAvailable()) return;

    try {
      const resp = await fetch(`${TILE_BASE}/temperature/metadata.json?_=${Date.now()}`);
      if (!resp.ok) return;
      const meta = await resp.json();

      // Persist for next session / next check
      localStorage.setItem('gale_hrrr', JSON.stringify({
        run: meta.hrrr_run, date: meta.hrrr_date, hour: meta.hrrr_hour
      }));

      if (meta.hrrr_run && meta.hrrr_run !== lastTempRun) {
        lastTempRun = meta.hrrr_run;
        // Tell service worker to purge stale tile cache
        if (navigator.serviceWorker?.controller) {
          navigator.serviceWorker.controller.postMessage('clear-tiles');
        }
        // Clear in-memory pixel-sampling cache
        Object.keys(tileCache).forEach(k => delete tileCache[k]);
        // Crossfade temperature raster tiles
        crossfadeTemperature(Date.now());
        // Reload wind particle textures
        if (windParticleLayer && windParticleLayer.reloadWind) windParticleLayer.reloadWind();
        setTimeout(updateAllLabels, 1000);
        document.getElementById('freshnessText').textContent =
          `HRRR ${meta.hrrr_hour}Z · MRMS live`;
      }
    } catch (e) { /* offline — SW serves cached tiles */ }
  }

  // Check immediately on load, then every 5 min (smart skip avoids needless fetches)
  checkTempFreshness();
  setInterval(checkTempFreshness, 300000);

  // ─── Layer Toggle ───────────────────────────
  function updateLayerVisibility() {
    // Radar: flat raster drapes over terrain automatically in 3D
    if (map.getLayer('radar-layer')) {
      map.setLayoutProperty('radar-layer', 'visibility', layers.radar ? 'visible' : 'none');
    }
    if (map.getLayer('satellite-layer')) {
      map.setLayoutProperty('satellite-layer', 'visibility', layers.satellite ? 'visible' : 'none');
    }
    if (map.getLayer('alerts-fill')) {
      map.setLayoutProperty('alerts-fill', 'visibility', layers.alerts ? 'visible' : 'none');
      map.setLayoutProperty('alerts-line', 'visibility', layers.alerts ? 'visible' : 'none');
    }

    // Temperature raster overlay (uses tracked IDs for crossfade)
    if (map.getLayer(currentTempLayerId)) {
      map.setLayoutProperty(currentTempLayerId, 'visibility', layers.temp ? 'visible' : 'none');
    }
    if (map.getLayer(currentTempF01LayerId)) {
      map.setLayoutProperty(currentTempF01LayerId, 'visibility', layers.temp ? 'visible' : 'none');
    }
    if (layers.temp) {
      applyForecastInterpolation();
    }

    // HRRR layers: label visibility
    if (map.getLayer('temp-labels-layer')) {
      map.setLayoutProperty('temp-labels-layer', 'visibility', layers.temp ? 'visible' : 'none');
    }
    if (map.getLayer('wind-labels-layer')) {
      map.setLayoutProperty('wind-labels-layer', 'visibility', layers.wind ? 'visible' : 'none');
    }
    if (map.getLayer('wind-arrows-layer')) {
      map.setLayoutProperty('wind-arrows-layer', 'visibility', layers.wind ? 'visible' : 'none');
    }
    if (map.getLayer('precip-labels-layer')) {
      map.setLayoutProperty('precip-labels-layer', 'visibility', layers.precip ? 'visible' : 'none');
    }

    // Refresh labels when toggled on
    if (layers.temp) updateTempLabels();
    if (layers.wind) { updateWindLabels(); map.triggerRepaint(); }
    if (layers.precip) updatePrecipLabels();

    // Legend: radar takes priority, then precip, then wind, then temp
    const legend = document.getElementById('legend');
    const grad = document.getElementById('legendGradient');
    const lMin = document.getElementById('legendMin');
    const lMax = document.getElementById('legendMax');

    if (layers.radar) {
      legend.classList.add('visible', 'show-palette');
      grad.className = 'legend-gradient radar';
      grad.style.background = RADAR_PALETTES[currentRadarPalette].gradient;
      lMin.textContent = 'Light';
      lMax.textContent = 'Heavy';
    } else if (layers.precip) {
      legend.classList.add('visible');
      legend.classList.remove('show-palette');
      grad.className = 'legend-gradient';
      grad.style.background = 'linear-gradient(to right, #aadcaa, #64c864, #32b432, #3296ff, #1e64e6, #c8c832, #e68232, #c81e32)';
      lMin.textContent = 'Trace';
      lMax.textContent = '2"+';
    } else if (layers.wind) {
      legend.classList.add('visible');
      legend.classList.remove('show-palette');
      grad.className = 'legend-gradient';
      grad.style.background = 'linear-gradient(to right, #c8e6ff, #64b4ff, #3278e6, #32c864, #e6e632, #e69632, #e65032, #c81e1e, #960050)';
      lMin.textContent = '0 mph';
      lMax.textContent = '90 mph';
    } else if (layers.temp) {
      legend.classList.add('visible');
      legend.classList.remove('show-palette');
      grad.className = 'legend-gradient temp';
      grad.style.background = '';
      lMin.textContent = '-40°F';
      lMax.textContent = '120°F';
    } else {
      legend.classList.remove('visible', 'show-palette');
      grad.style.background = '';
    }
  }

  // ─── Colorblind Radar Palettes ─────────────────
  const RADAR_PALETTES = {
    standard:     { hueRotate: 0,   saturation: 0,    contrast: 0,   label: 'Standard',      gradient: 'linear-gradient(to right, #00000000, #00ff00, #ffff00, #ff8800, #ff0000, #ff00ff)' },
    deuteranopia: { hueRotate: 90,  saturation: 0.2,  contrast: 0,   label: 'Blue-Orange',   gradient: 'linear-gradient(to right, #00000000, #0088ff, #88ccff, #ffcc00, #ff8800, #ff00ff)' },
    protanopia:   { hueRotate: 180, saturation: 0.1,  contrast: 0,   label: 'Yellow-Purple', gradient: 'linear-gradient(to right, #00000000, #ff00ff, #8800ff, #0088ff, #00ffff, #00ff00)' },
    highContrast: { hueRotate: 0,   saturation: 0.5,  contrast: 0.3, label: 'High Contrast', gradient: 'linear-gradient(to right, #00000000, #00ff00, #ffff00, #ff8800, #ff0000, #ff00ff)' }
  };

  let currentRadarPalette = localStorage.getItem('gale_radar_palette') || 'standard';

  function applyRadarPalette(key) {
    const p = RADAR_PALETTES[key];
    if (!p) return;
    currentRadarPalette = key;
    localStorage.setItem('gale_radar_palette', key);

    if (map.getLayer('radar-layer')) {
      map.setPaintProperty('radar-layer', 'raster-hue-rotate', p.hueRotate);
      map.setPaintProperty('radar-layer', 'raster-saturation', p.saturation);
      map.setPaintProperty('radar-layer', 'raster-contrast', p.contrast);
    }

    // Update active button state
    document.querySelectorAll('.palette-btn').forEach(btn => {
      const isActive = btn.dataset.palette === key;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', String(isActive));
    });

    // Update legend gradient when radar is active
    if (layers.radar) {
      document.getElementById('legendGradient').style.background = p.gradient;
    }

    announce(`Radar palette: ${p.label}`);
  }

  document.querySelectorAll('.palette-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      applyRadarPalette(btn.dataset.palette);
    });
  });

  document.querySelectorAll('.layer-btn[data-layer]').forEach(btn => {
    btn.addEventListener('click', () => {
      const layer = btn.dataset.layer;
      layers[layer] = !layers[layer];
      btn.classList.toggle('active', layers[layer]);
      btn.setAttribute('aria-pressed', String(layers[layer]));
      announce(`${btn.querySelector('span').textContent} layer ${layers[layer] ? 'on' : 'off'}`);
      updateLayerVisibility();
    });
  });

  // ─── 3D / 2D View Toggle ──────────────────────
  let is3D = true;
  const viewToggle = document.getElementById('viewToggle');

  function toggleView() {
    is3D = !is3D;
    map.easeTo({ pitch: is3D ? 60 : 0, duration: 600 });
    map.setTerrain(is3D ? { source: 'dem', exaggeration: 1.5 } : null);
    viewToggle.classList.toggle('active', is3D);
    viewToggle.querySelector('span').textContent = is3D ? '3D' : '2D';
    viewToggle.setAttribute('aria-pressed', String(is3D));
    viewToggle.setAttribute('aria-label', is3D ? 'Switch to 2D view' : 'Switch to 3D view');
    announce(`${is3D ? '3D' : '2D'} view`);
  }

  viewToggle.addEventListener('click', toggleView);

  // ─── Mobile Layers Dropdown ────────────────────
  const layersToggle = document.getElementById('layersToggle');
  const sidebar = document.querySelector('.sidebar');

  layersToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    sidebar.classList.toggle('open');
    layersToggle.classList.toggle('active');
    layersToggle.setAttribute('aria-expanded', String(sidebar.classList.contains('open')));
  });

  // ─── Recent Locations Cache ─────────────────
  const RECENTS_KEY = 'gale_recent_locations';
  const MAX_RECENTS = 5;

  function getRecentLocations() {
    try { return JSON.parse(localStorage.getItem(RECENTS_KEY)) || []; }
    catch { return []; }
  }

  function saveRecentLocation(name, lat, lon) {
    const recents = getRecentLocations().filter(r => r.name !== name);
    recents.unshift({ name, lat, lon });
    if (recents.length > MAX_RECENTS) recents.length = MAX_RECENTS;
    localStorage.setItem(RECENTS_KEY, JSON.stringify(recents));
  }

  function showRecentLocations() {
    const recents = getRecentLocations();
    if (recents.length === 0) return;
    searchResults.innerHTML = '<div class="recent-header">Recent</div>';
    recents.forEach(r => {
      const item = document.createElement('div');
      item.className = 'search-result-item';
      item.setAttribute('role', 'option');
      item.textContent = r.name;
      item.addEventListener('click', () => {
        map.flyTo({ center: [r.lon, r.lat], zoom: 8, duration: 1500 });
        setUserLocationMarker(r.lon, r.lat);
        closeSearch();
        map.once('moveend', () => {
          map.fire('click', { lngLat: { lng: r.lon, lat: r.lat }, point: map.project([r.lon, r.lat]), originalEvent: new MouseEvent('click') });
        });
      });
      searchResults.appendChild(item);
    });
    searchResults.classList.add('active');
    searchInput.setAttribute('aria-expanded', 'true');
  }

  // ─── Search (Nominatim) ─────────────────────
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  let searchTimeout;

  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    const q = searchInput.value.trim();
    if (q.length < 3) {
      if (q.length === 0) showRecentLocations();
      else searchResults.classList.remove('active');
      return;
    }

    searchTimeout = setTimeout(async () => {
      try {
        const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=us&limit=5`);
        const results = await resp.json();
        searchResults.innerHTML = '';
        if (results.length === 0) {
          searchResults.classList.remove('active');
          return;
        }
        results.forEach(r => {
          const item = document.createElement('div');
          item.className = 'search-result-item';
          item.setAttribute('role', 'option');
          item.textContent = r.display_name;
          item.addEventListener('click', () => {
            const lat = parseFloat(r.lat), lon = parseFloat(r.lon);
            saveRecentLocation(r.display_name.split(',')[0], lat, lon);
            map.flyTo({ center: [lon, lat], zoom: 8, duration: 1500 });
            setUserLocationMarker(lon, lat);
            closeSearch();
            map.once('moveend', () => {
              map.fire('click', { lngLat: { lng: lon, lat }, point: map.project([lon, lat]), originalEvent: new MouseEvent('click') });
            });
          });
          searchResults.appendChild(item);
        });
        searchResults.classList.add('active');
        searchInput.setAttribute('aria-expanded', 'true');
      } catch (e) { console.warn('Search error:', e); }
    }, 350);
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-container') && !e.target.closest('.logo')) {
      searchResults.classList.remove('active');
      if (searchContainer.classList.contains('open')) closeSearch();
    }
  });

  // ─── Point Forecast (NWS API) ───────────────
  const drawer = document.getElementById('forecastDrawer');

  map.on('click', async (e) => {
    // Close mobile layers dropdown
    sidebar.classList.remove('open');
    layersToggle.classList.remove('active');

    const { lng, lat } = e.lngLat;

    // Cross-section mode intercepts clicks
    if (xsectionMode) {
      handleXsectionClick(lng, lat);
      return;
    }

    // Only fetch forecast for CONUS
    if (lat < 24 || lat > 50 || lng < -125 || lng > -66) return;

    document.getElementById('forecastLocation').textContent = 'Loading...';
    document.getElementById('forecastCoords').textContent = `${lat.toFixed(4)}°N, ${Math.abs(lng).toFixed(4)}°W`;
    document.getElementById('forecastTemp').innerHTML = '—<span>°F</span>';
    document.getElementById('forecastCondition').textContent = 'Sampling HRRR tiles...';
    document.getElementById('fWind').textContent = '—';
    document.getElementById('fHumidity').textContent = '—';
    document.getElementById('fDewpoint').textContent = '—';
    document.getElementById('fPrecip').textContent = '—';
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false');

    // Phase 1: Instant HRRR tile sampling (parallel, <200ms)
    const samples = [
      sampleTileAt(lng, lat, 'temperature'),
      sampleTileAt(lng, lat, 'wind'),
      sampleTileAt(lng, lat, 'precipitation')
    ];
    if (forecastT > 0) samples.push(sampleTileAt(lng, lat, 'temperature-f01'));
    const results = await Promise.all(samples);
    const tempF00 = results[0];
    const windMph = results[1];
    const precipIn = results[2];
    const tempF01 = forecastT > 0 ? results[3] : null;

    // Interpolate temperature if future slider is active
    let tempF = tempF00;
    if (tempF00 !== null && tempF01 !== null && forecastT > 0) {
      tempF = Math.round(tempF00 * (1 - forecastT) + tempF01 * forecastT);
    }

    if (tempF !== null) {
      document.getElementById('forecastTemp').innerHTML = `${tempF}<span>°F</span>`;
    }
    if (windMph !== null) {
      document.getElementById('fWind').textContent = `${windMph} mph`;
    }
    if (precipIn !== null) {
      document.getElementById('fPrecip').textContent = precipIn > 0 ? `${precipIn} in` : 'None';
    }
    document.getElementById('forecastCondition').textContent = 'HRRR data · fetching NWS details...';

    // Phase 1.5: Render sounding if atmosphere data loaded
    renderSounding(lng, lat);

    // Phase 1.6: Open-Meteo (solar, UV, clouds — fire-and-forget parallel)
    fetchOpenMeteo(lng, lat);

    // Phase 2: Async NWS API (2-5s, fills in city name + supplemental data)
    try {
      const pointResp = await fetch(`https://api.weather.gov/points/${lat.toFixed(4)},${lng.toFixed(4)}`, {
        headers: { 'User-Agent': 'Gale Weather (galeweather.com)' }
      });
      const pointData = await pointResp.json();

      const city = pointData.properties?.relativeLocation?.properties;
      const locName = city ? `${city.city}, ${city.state}` : `${lat.toFixed(2)}°N`;
      document.getElementById('forecastLocation').textContent = locName;

      if (!pointData.properties?.forecastHourly) {
        document.getElementById('forecastCondition').textContent = 'HRRR data · NWS grid unavailable';
        return;
      }

      const fcResp = await fetch(pointData.properties.forecastHourly, {
        headers: { 'User-Agent': 'Gale Weather (galeweather.com)' }
      });
      const fcData = await fcResp.json();
      const now = fcData.properties.periods[0];

      // NWS overrides HRRR temp if available (NWS is observation-corrected)
      document.getElementById('forecastTemp').innerHTML = `${now.temperature}<span>°${now.temperatureUnit}</span>`;
      document.getElementById('forecastCondition').textContent = now.shortForecast;
      document.getElementById('fWind').textContent = now.windSpeed;
      document.getElementById('fHumidity').textContent = now.relativeHumidity?.value ? `${Math.round(now.relativeHumidity.value)}%` : '—';
      document.getElementById('fDewpoint').textContent = now.dewpoint?.value ? `${Math.round(now.dewpoint.value * 9/5 + 32)}°F` : '—';
      document.getElementById('fPrecip').textContent = now.probabilityOfPrecipitation?.value ? `${now.probabilityOfPrecipitation.value}%` : (precipIn !== null && precipIn > 0 ? `${precipIn} in` : '0%');

    } catch (err) {
      console.warn('NWS forecast error:', err);
      // HRRR values stay visible — just update the status text
      document.getElementById('forecastLocation').textContent = tempF !== null ? `${lat.toFixed(2)}°N, ${Math.abs(lng).toFixed(2)}°W` : 'Forecast unavailable';
      document.getElementById('forecastCondition').textContent = tempF !== null ? 'HRRR data · NWS unavailable' : 'NWS API may be temporarily down';
    }
  });

  document.getElementById('forecastClose').addEventListener('click', () => {
    drawer.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
  });

  // ─── Unified Timeline ──────────────────────────
  // Single slider: 0-10 = past radar (-50m to now), 10 = NOW, 11-70 = future forecast (+1m to +60m)
  const timeSlider = document.getElementById('timeSlider');
  const timeLabel = document.getElementById('timeLabel');
  const playBtn = document.getElementById('playBtn');
  let playing = false;
  let playInterval;

  // Iowa State Mesonet time-stamped radar tiles (index 0 = now, 10 = -50 min)
  const radarProducts = [
    'nexrad-n0q-900913',           // Now
    'nexrad-n0q-900913-m05m',      // 5 min ago
    'nexrad-n0q-900913-m10m',      // 10 min ago
    'nexrad-n0q-900913-m15m',      // 15 min ago
    'nexrad-n0q-900913-m20m',      // 20 min ago
    'nexrad-n0q-900913-m25m',      // 25 min ago
    'nexrad-n0q-900913-m30m',      // 30 min ago
    'nexrad-n0q-900913-m35m',      // 35 min ago
    'nexrad-n0q-900913-m40m',      // 40 min ago
    'nexrad-n0q-900913-m45m',      // 45 min ago
    'nexrad-n0q-900913-m50m',      // 50 min ago
  ];

  // Slider value → radar product index (reverse: slider 0=oldest, 10=now)
  function sliderToRadarIdx(sliderVal) {
    return radarProducts.length - 1 - sliderVal;
  }

  function positionTimeLabel() {
    const pct = (timeSlider.value - timeSlider.min) / (timeSlider.max - timeSlider.min);
    const sliderWidth = timeSlider.offsetWidth;
    const thumbOffset = 8 + pct * (sliderWidth - 16); // account for thumb radius
    timeLabel.style.left = thumbOffset + 'px';
  }

  function getTimelineLabel(val) {
    if (val < 10) return `-${(10 - val) * 5}m`;
    if (val === 10) return 'Now';
    return `+${val - 10}m`;
  }

  timeSlider.addEventListener('input', () => {
    const val = parseInt(timeSlider.value);
    if (val <= 10) {
      // Past radar frames: slider 0 = -50m (oldest), 10 = now
      updateRadarFrame(sliderToRadarIdx(val));
      forecastT = 0;
      applyForecastInterpolation();
      // Restore radar, hide forecast precip
      if (map.getLayer('radar-layer')) map.setPaintProperty('radar-layer', 'raster-opacity', 0.7);
      if (map.getLayer('precip-forecast-layer')) map.setPaintProperty('precip-forecast-layer', 'raster-opacity', 0);
    } else {
      // Future forecast: slider 11-70 → forecastT 1/60 to 1.0
      updateRadarFrame(0);
      forecastT = (val - 10) / 60;
      applyForecastInterpolation();
      updateTempLabels();
      // Crossfade: radar out, HRRR precip in over first 10 minutes of future
      const fadeT = Math.min((val - 10) / 10, 1); // 0→1 over slider 11-20
      if (map.getLayer('radar-layer')) map.setPaintProperty('radar-layer', 'raster-opacity', 0.7 * (1 - fadeT));
      if (map.getLayer('precip-forecast-layer')) map.setPaintProperty('precip-forecast-layer', 'raster-opacity', 0.7 * fadeT);
    }
    timeLabel.textContent = getTimelineLabel(val);
    timeSlider.setAttribute('aria-valuetext', val === 10 ? 'Now' : val < 10 ? `${(10 - val) * 5} minutes ago` : `+${val - 10} minutes`);

  // ─── Atmospheric Sounding Renderer ──────────
  function renderSounding(lng, lat) {
    const profile = sampleAtmosphere(lng, lat);
    const canvas = document.getElementById('soundingCanvas');
    if (!canvas || !profile) return;

    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr || 400;
    canvas.height = rect.height * dpr || 300;
    ctx.scale(dpr, dpr);
    const W = rect.width || 400, H = rect.height || 300;

    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, W, H);

    // Axes
    const margin = { top: 20, right: 30, bottom: 30, left: 45 };
    const pw = W - margin.left - margin.right;
    const ph = H - margin.top - margin.bottom;

    // X: temperature (-80°C to +40°C)
    const tempMin = -80, tempMax = 40;
    const xScale = (t) => margin.left + (t - tempMin) / (tempMax - tempMin) * pw;

    // Y: log-pressure (1000mb bottom, 250mb top)
    const pTop = 250, pBot = 1000;
    const yScale = (p) => margin.top + (Math.log(pBot) - Math.log(p)) / (Math.log(pBot) - Math.log(pTop)) * ph;

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 0.5;
    for (let t = -60; t <= 40; t += 20) {
      ctx.beginPath();
      ctx.moveTo(xScale(t), margin.top);
      ctx.lineTo(xScale(t), H - margin.bottom);
      ctx.stroke();
    }
    for (const p of [1000, 925, 850, 700, 500, 250]) {
      ctx.beginPath();
      ctx.moveTo(margin.left, yScale(p));
      ctx.lineTo(W - margin.right, yScale(p));
      ctx.stroke();
    }

    // Axis labels
    ctx.fillStyle = '#64748b';
    ctx.font = '9px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    for (let t = -60; t <= 40; t += 20) {
      ctx.fillText(`${t}°`, xScale(t), H - margin.bottom + 14);
    }
    ctx.textAlign = 'right';
    for (const p of [1000, 925, 850, 700, 500, 250]) {
      ctx.fillText(`${p}`, margin.left - 5, yScale(p) + 3);
    }
    ctx.fillText('mb', margin.left - 5, margin.top - 6);
    ctx.textAlign = 'center';
    ctx.fillText('°C', W / 2, H - 2);

    // 0°C isotherm
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(xScale(0), margin.top);
    ctx.lineTo(xScale(0), H - margin.bottom);
    ctx.stroke();
    ctx.setLineDash([]);

    // Temperature line (red)
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    profile.forEach((lev, i) => {
      const x = xScale(lev.tempC);
      const y = yScale(lev.pressure);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Dewpoint line (green) — Td ≈ T - (100 - RH) / 5
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 2;
    ctx.beginPath();
    profile.forEach((lev, i) => {
      const td = lev.tempC - (100 - lev.rh) / 5;
      const x = xScale(td);
      const y = yScale(lev.pressure);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Wind barbs at each level
    profile.forEach(lev => {
      const y = yScale(lev.pressure);
      const x = W - margin.right + 10;
      const speed = Math.sqrt(lev.uWind * lev.uWind + lev.vWind * lev.vWind) * 1.944; // knots
      const dir = (Math.atan2(-lev.uWind, -lev.vWind) * 180 / Math.PI + 360) % 360;
      drawWindBarb(ctx, x, y, speed, dir);
    });

    // Legend
    ctx.fillStyle = '#ef4444'; ctx.fillRect(margin.left + 4, margin.top + 2, 12, 2);
    ctx.fillStyle = '#94a3b8'; ctx.font = '9px DM Sans, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Temp', margin.left + 20, margin.top + 7);
    ctx.fillStyle = '#10b981'; ctx.fillRect(margin.left + 60, margin.top + 2, 12, 2);
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('Dewpt', margin.left + 76, margin.top + 7);
  }

  function drawWindBarb(ctx, cx, cy, speedKnots, dirDeg) {
    if (speedKnots < 2) {
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.stroke();
      return;
    }
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((dirDeg + 180) * Math.PI / 180);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, -14); ctx.stroke();

    let remaining = speedKnots;
    let pos = -14;
    while (remaining >= 50) {
      ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(6, pos + 2); ctx.lineTo(0, pos + 4);
      ctx.fillStyle = '#94a3b8'; ctx.fill();
      pos += 5; remaining -= 50;
    }
    while (remaining >= 10) {
      ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(6, pos + 3); ctx.stroke();
      pos += 3; remaining -= 10;
    }
    if (remaining >= 5) {
      ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(3, pos + 1.5); ctx.stroke();
    }
    ctx.restore();
  }

  function renderCrossSection(ptA, ptB) {
    if (!ATMOS.loaded) return;

    const canvas = document.getElementById('xsectionCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;

    // Sample 50 points along transect
    const numSamples = 50;
    const profiles = [];
    for (let i = 0; i <= numSamples; i++) {
      const t = i / numSamples;
      const lng = ptA[0] + (ptB[0] - ptA[0]) * t;
      const lat = ptA[1] + (ptB[1] - ptA[1]) * t;
      profiles.push(sampleAtmosphere(lng, lat));
    }

    // Distance in miles (haversine)
    const R = 3959;
    const dLat = (ptB[1] - ptA[1]) * Math.PI / 180;
    const dLon = (ptB[0] - ptA[0]) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(ptA[1] * Math.PI / 180) * Math.cos(ptB[1] * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
    const totalMiles = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    document.getElementById('xsectionInfo').textContent =
      `${totalMiles.toFixed(0)} mi · ${ptA[1].toFixed(2)}°N,${Math.abs(ptA[0]).toFixed(2)}°W → ${ptB[1].toFixed(2)}°N,${Math.abs(ptB[0]).toFixed(2)}°W`;

    // Clear
    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, W, H);

    const margin = { top: 16, right: 16, bottom: 28, left: 42 };
    const pw = W - margin.left - margin.right;
    const ph = H - margin.top - margin.bottom;

    // Scales
    const pTop = 250, pBot = 1000;
    const xScale = (i) => margin.left + (i / numSamples) * pw;
    const yScale = (p) => margin.top + (Math.log(pBot) - Math.log(p)) / (Math.log(pBot) - Math.log(pTop)) * ph;

    // Temperature color ramp (same as temp tiles)
    function tempColor(c) {
      const t = (c + 40) / 80; // -40C → +40C mapped to 0→1
      const clamped = Math.max(0, Math.min(1, t));
      if (clamped < 0.25) return `hsl(240, 80%, ${30 + clamped * 4 * 40}%)`;
      if (clamped < 0.5) return `hsl(${240 - (clamped - 0.25) * 4 * 120}, 80%, 60%)`;
      if (clamped < 0.75) return `hsl(${120 - (clamped - 0.5) * 4 * 60}, 90%, 50%)`;
      return `hsl(${60 - (clamped - 0.75) * 4 * 60}, 100%, ${50 - (clamped - 0.75) * 4 * 20}%)`;
    }

    // Fill temperature (colored rectangles)
    const levels = ATMOS.LEVELS;
    for (let i = 0; i < numSamples; i++) {
      const p0 = profiles[i], p1 = profiles[i + 1];
      if (!p0 || !p1) continue;
      const x0 = xScale(i), x1 = xScale(i + 1);
      const cellW = x1 - x0 + 1;

      for (let li = 0; li < levels.length - 1; li++) {
        const y0 = yScale(levels[li]);
        const y1 = yScale(levels[li + 1]);
        const cellH = y1 - y0;
        // Average temp of 4 corners
        const avgC = (p0[li].tempC + p1[li].tempC + p0[li + 1].tempC + p1[li + 1].tempC) / 4;
        ctx.fillStyle = tempColor(avgC);
        ctx.globalAlpha = 0.7;
        ctx.fillRect(x0, y0, cellW, cellH);
      }
    }
    ctx.globalAlpha = 1;

    // Humidity contours (50%, 75%, 90%)
    [50, 75, 90].forEach((rhThreshold, ci) => {
      ctx.strokeStyle = ci === 2 ? 'rgba(16,185,129,0.6)' : ci === 1 ? 'rgba(16,185,129,0.4)' : 'rgba(16,185,129,0.2)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      for (let li = 0; li < levels.length; li++) {
        ctx.beginPath();
        let started = false;
        for (let i = 0; i <= numSamples; i++) {
          const p = profiles[i];
          if (!p || p[li].rh < rhThreshold) { started = false; continue; }
          const x = xScale(i), y = yScale(levels[li]);
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    });
    ctx.setLineDash([]);

    // Wind barbs at grid intersections (every 5th sample, every level)
    for (let i = 0; i <= numSamples; i += 5) {
      const p = profiles[i];
      if (!p) continue;
      for (let li = 0; li < levels.length; li++) {
        const x = xScale(i), y = yScale(levels[li]);
        const speed = Math.sqrt(p[li].uWind ** 2 + p[li].vWind ** 2) * 1.944;
        const dir = (Math.atan2(-p[li].uWind, -p[li].vWind) * 180 / Math.PI + 360) % 360;
        drawWindBarb(ctx, x, y, speed, dir);
      }
    }

    // Axes
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(margin.left, margin.top);
    ctx.lineTo(margin.left, H - margin.bottom);
    ctx.lineTo(W - margin.right, H - margin.bottom);
    ctx.stroke();

    // Pressure labels
    ctx.fillStyle = '#64748b';
    ctx.font = '9px JetBrains Mono, monospace';
    ctx.textAlign = 'right';
    for (const p of levels) {
      ctx.fillText(`${p}`, margin.left - 4, yScale(p) + 3);
    }
    ctx.fillText('mb', margin.left - 4, margin.top - 4);

    // Distance labels
    ctx.textAlign = 'center';
    for (let d = 0; d <= totalMiles; d += Math.max(50, Math.round(totalMiles / 5 / 50) * 50)) {
      const x = margin.left + (d / totalMiles) * pw;
      ctx.fillText(`${d}mi`, x, H - margin.bottom + 14);
    }
    // Always label endpoint
    ctx.fillText(`${Math.round(totalMiles)}mi`, W - margin.right, H - margin.bottom + 14);
    ctx.fillText('A', margin.left, H - margin.bottom + 14);
  }

  // ─── 3D Atmospheric Columns ────────────────
  let atmosColumnsVisible = false;

  function toggleAtmosColumns() {
    atmosColumnsVisible = !atmosColumnsVisible;
    if (atmosColumnsVisible) {
      updateAtmosColumns();
    } else if (map.getLayer('atmos-columns-layer')) {
      map.setLayoutProperty('atmos-columns-layer', 'visibility', 'none');
    }
    announce(`Atmosphere columns ${atmosColumnsVisible ? 'on' : 'off'}`);
  }

  function updateAtmosColumns() {
    if (!atmosColumnsVisible || !ATMOS.loaded) return;
    if (map.getZoom() < 4) {
      if (map.getLayer('atmos-columns-layer')) {
        map.setLayoutProperty('atmos-columns-layer', 'visibility', 'none');
      }
      return;
    }

    const bounds = map.getBounds();
    const step = 1.0; // 1° grid for columns
    const features = [];

    const west = Math.max(bounds.getWest(), ATMOS.LON_MIN);
    const east = Math.min(bounds.getEast(), ATMOS.LON_MAX);
    const south = Math.max(bounds.getSouth(), ATMOS.LAT_MIN);
    const north = Math.min(bounds.getNorth(), ATMOS.LAT_MAX);

    for (let lon = Math.ceil(west / step) * step; lon <= east; lon += step) {
      for (let lat = Math.ceil(south / step) * step; lat <= north; lat += step) {
        const profile = sampleAtmosphere(lon, lat);
        if (!profile) continue;

        const surfTemp = profile[0].tempC;
        const surfHgt = profile[0].hgt;
        const topHgt = profile[profile.length - 1].hgt;
        const height = Math.max(100, (topHgt - surfHgt) * 0.3); // scale for visibility

        // Color by surface temp (-30C..+40C mapped to blue..red)
        const t = Math.max(0, Math.min(1, (surfTemp + 30) / 70));
        const r = Math.round(t * 255);
        const b = Math.round((1 - t) * 255);
        const color = `rgb(${r},${80},${b})`;

        const half = step * 0.4;
        features.push({
          type: 'Feature',
          geometry: {
            type: 'Polygon',
            coordinates: [[
              [lon - half, lat - half],
              [lon + half, lat - half],
              [lon + half, lat + half],
              [lon - half, lat + half],
              [lon - half, lat - half]
            ]]
          },
          properties: { height, color }
        });
      }
    }

    const geojson = { type: 'FeatureCollection', features };

    if (!map.getSource('atmos-columns')) {
      map.addSource('atmos-columns', { type: 'geojson', data: geojson });
      map.addLayer({
        id: 'atmos-columns-layer',
        type: 'fill-extrusion',
        source: 'atmos-columns',
        paint: {
          'fill-extrusion-color': ['get', 'color'],
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.35
        }
      });
    } else {
      map.getSource('atmos-columns').setData(geojson);
      map.setLayoutProperty('atmos-columns-layer', 'visibility', 'visible');
    }
  }

  // Debounced update on map move
  let atmosColumnsTimer = null;
  map.on('moveend', () => {
    if (!atmosColumnsVisible) return;
    clearTimeout(atmosColumnsTimer);
    atmosColumnsTimer = setTimeout(updateAtmosColumns, 300);
  });

  // ─── Load Atmosphere on Startup ────────────
  map.on('load', () => {
    loadAtmosphereProfile();
  });

  // ─── Keyboard Shortcuts ─────────────────────
  document.addEventListener('keydown', (e) => {
    // Allow Escape from within search input to close search
    if (e.key === 'Escape' && e.target.tagName === 'INPUT') {
      closeSearch();
      drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true');
      sidebar.classList.remove('open');
      layersToggle.classList.remove('active'); layersToggle.setAttribute('aria-expanded', 'false');
      return;
    }
    if (e.target.tagName === 'INPUT') return;
    switch(e.key) {
      case '/': e.preventDefault(); openSearch(); break;
      case 'Escape': closeSearch(); drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); sidebar.classList.remove('open'); layersToggle.classList.remove('active'); layersToggle.setAttribute('aria-expanded', 'false'); xsectionPanel.classList.remove('open'); if (xsectionMode) toggleXsectionMode(); break;
      case ' ': e.preventDefault(); playBtn.click(); break;
      case 'r': document.querySelector('[data-layer="radar"]').click(); break;
      case 't': document.querySelector('[data-layer="temp"]').click(); break;
      case 'w': document.querySelector('[data-layer="wind"]').click(); break;
      case 'p': document.querySelector('[data-layer="precip"]').click(); break;
      case 's': document.querySelector('[data-layer="satellite"]').click(); break;
      case 'v': toggleView(); break;
      case 'x': toggleXsectionMode(); break;
      case 'a': toggleAtmosColumns(); break;
    }
  });

})();
</script>
</body>
</html>
