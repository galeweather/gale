<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gale — Open Weather Visualization</title>
<meta name="description" content="Free, open-source weather visualization for the United States. Radar, satellite, forecasts. No accounts, no tracking.">

<!-- MapLibre GL JS -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ═══════════════════════════════════════════
     CSS VARIABLES
     ═══════════════════════════════════════════ */
  :root {
    --bg-primary: #0a0e17;
    --bg-secondary: #111827;
    --bg-panel: rgba(10, 14, 23, 0.92);
    --bg-glass: rgba(17, 24, 39, 0.75);
    --border-subtle: rgba(255, 255, 255, 0.06);
    --border-active: rgba(99, 179, 237, 0.3);
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #38bdf8;
    --accent-dim: rgba(56, 189, 248, 0.15);
    --warning: #f59e0b;
    --danger: #ef4444;
    --success: #10b981;
    --radius: 12px;
    --radius-sm: 8px;
    --font: 'DM Sans', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --shadow-lg: 0 24px 48px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ═══════════════════════════════════════════
     RESET & BASE
     ═══════════════════════════════════════════ */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font);
    background: var(--bg-primary);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  /* ═══════════════════════════════════════════
     MAP (full bleed)
     ═══════════════════════════════════════════ */
  #map {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  /* MapLibre overrides */
  .maplibregl-ctrl-attrib { opacity: 0.4; font-size: 10px !important; }
  .maplibregl-ctrl-attrib a { color: var(--text-muted) !important; }
  .maplibregl-ctrl-group {
    background: var(--bg-panel) !important;
    border: 1px solid var(--border-subtle) !important;
    border-radius: var(--radius-sm) !important;
    overflow: hidden;
    backdrop-filter: blur(16px);
  }
  .maplibregl-ctrl-group button {
    width: 36px !important;
    height: 36px !important;
  }
  .maplibregl-ctrl-group button + button {
    border-top: 1px solid var(--border-subtle) !important;
  }
  .maplibregl-ctrl button .maplibregl-ctrl-icon {
    filter: invert(0.85);
  }

  /* ═══════════════════════════════════════════
     TOP BAR — Logo + Search
     ═══════════════════════════════════════════ */
  .top-bar {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }

  .logo {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    cursor: default;
    flex-shrink: 0;
    box-shadow: var(--shadow-md);
  }

  .logo-icon {
    width: 24px;
    height: 24px;
  }

  .logo-text {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .logo-badge {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 2px;
  }

  .search-container {
    pointer-events: auto;
    position: relative;
    flex: 1;
    max-width: 420px;
  }

  .search-input {
    width: 100%;
    padding: 11px 16px 11px 40px;
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: border-color var(--transition);
    box-shadow: var(--shadow-md);
  }

  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus { border-color: var(--border-active); }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    overflow: hidden;
    display: none;
    box-shadow: var(--shadow-lg);
  }

  .search-results.active { display: block; }

  .search-result-item {
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    transition: background var(--transition);
    border-bottom: 1px solid var(--border-subtle);
  }

  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover {
    background: var(--accent-dim);
    color: var(--text-primary);
  }

  /* ═══════════════════════════════════════════
     RIGHT SIDEBAR — Layer Controls
     ═══════════════════════════════════════════ */
  .sidebar {
    position: fixed;
    top: 80px;
    right: 16px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 6px;
    box-shadow: var(--shadow-md);
  }

  .layer-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
    min-width: 120px;
  }

  .layer-btn:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-primary); }
  .layer-btn.active { background: var(--accent-dim); color: var(--accent); }

  .layer-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  .layer-divider {
    height: 1px;
    background: var(--border-subtle);
    margin: 4px 8px;
  }

  /* ═══════════════════════════════════════════
     BOTTOM TIMELINE BAR
     ═══════════════════════════════════════════ */
  .timeline-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: linear-gradient(to top, var(--bg-panel) 70%, transparent);
    padding: 40px 20px 16px;
    pointer-events: none;
  }

  .timeline-inner {
    pointer-events: auto;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .timeline-label {
    position: absolute;
    top: -28px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    text-align: center;
    background: var(--bg-panel);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border-subtle);
    transform: translateX(-50%);
    white-space: nowrap;
    pointer-events: none;
  }

  .timeline-track {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .timeline-track-row {
    display: flex;
    align-items: center;
    height: 20px;
    position: relative;
  }

  .timeline-past {
    flex: 0 0 48%;
    position: relative;
    display: flex;
    align-items: center;
  }

  .timeline-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: rgba(56, 189, 248, 0.3);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  .timeline-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    cursor: grab;
    transition: transform 0.15s ease;
  }

  .timeline-slider::-webkit-slider-thumb:hover {
    transform: scale(1.3);
  }

  .timeline-now {
    flex-shrink: 0;
    width: 2px;
    height: 20px;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    position: relative;
  }

  .timeline-future {
    flex: 0 0 48%;
    height: 4px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 2px;
    position: relative;
    align-self: center;
  }

  .timeline-future-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0.5;
    white-space: nowrap;
  }

  .timeline-ticks {
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
  }

  .timeline-tick {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-muted);
    opacity: 0.6;
  }

  .timeline-tick.now {
    color: var(--accent);
    opacity: 1;
    font-weight: 600;
  }

  .timeline-tick.future {
    opacity: 0.3;
  }

  .timeline-play {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border-subtle);
    background: var(--bg-panel);
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    flex-shrink: 0;
  }

  .timeline-play:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ═══════════════════════════════════════════
     POINT FORECAST DRAWER
     ═══════════════════════════════════════════ */
  .forecast-drawer {
    position: fixed;
    bottom: -400px;
    left: 16px;
    right: 16px;
    max-width: 480px;
    z-index: 150;
    background: var(--bg-panel);
    backdrop-filter: blur(24px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px;
    transition: bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow-lg);
  }

  .forecast-drawer.open { bottom: 70px; }

  .forecast-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .forecast-location {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .forecast-coords {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .forecast-close {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border-subtle);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all var(--transition);
  }

  .forecast-close:hover { border-color: var(--text-secondary); color: var(--text-primary); }

  .forecast-temp-hero {
    font-size: 48px;
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 4px;
  }

  .forecast-temp-hero span {
    font-size: 24px;
    color: var(--text-muted);
    font-weight: 400;
  }

  .forecast-condition {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }

  .forecast-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border-subtle);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }

  .forecast-stat {
    background: var(--bg-secondary);
    padding: 12px 10px;
    text-align: center;
  }

  .forecast-stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .forecast-stat-value {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
  }

  /* ═══════════════════════════════════════════
     DATA FRESHNESS BADGE
     ═══════════════════════════════════════════ */
  .freshness {
    position: fixed;
    bottom: 76px;
    right: 16px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle);
    border-radius: 20px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
  }

  .freshness-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse-dot 2s infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ═══════════════════════════════════════════
     LEGEND
     ═══════════════════════════════════════════ */
  .legend {
    position: fixed;
    left: 16px;
    bottom: 76px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0;
    transition: opacity var(--transition);
    pointer-events: none;
  }

  .legend.visible { opacity: 1; }

  .legend-gradient {
    width: 120px;
    height: 8px;
    border-radius: 4px;
  }

  .legend-gradient.temp {
    background: linear-gradient(to right, #1e3a5f, #2563eb, #06b6d4, #10b981, #84cc16, #eab308, #f97316, #ef4444, #991b1b);
  }

  .legend-gradient.radar {
    background: linear-gradient(to right, #00000000, #00ff00, #ffff00, #ff8800, #ff0000, #ff00ff);
  }

  .legend-gradient.wind {
    background: linear-gradient(to right, #c8e6ff, #64b4ff, #3278e6, #32c864, #e6e632, #e69618, #e6501e, #c81e1e, #960050);
  }

  .legend-gradient.precip {
    background: linear-gradient(to right, #aadcaa, #64c864, #32b432, #3296ff, #1e64e6, #c8c832, #e6821e, #c81e32);
  }

  .legend-labels {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 9px;
  }

  /* ═══════════════════════════════════════════
     LOCATION BUTTON
     ═══════════════════════════════════════════ */
  .locate-btn {
    position: fixed;
    bottom: 76px;
    right: 160px;
    z-index: 100;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border-subtle);
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    box-shadow: var(--shadow-md);
  }

  .locate-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ═══════════════════════════════════════════
     MOBILE RESPONSIVE
     ═══════════════════════════════════════════ */
  @media (max-width: 640px) {
    .top-bar { top: 10px; left: 10px; right: 10px; }
    .logo-badge { display: none; }
    .search-container { max-width: none; }
    .sidebar { top: auto; bottom: 76px; right: 10px; flex-direction: row; padding: 4px; }
    .layer-btn { min-width: auto; padding: 8px 10px; }
    .layer-btn span { display: none; }
    .forecast-drawer { left: 10px; right: 10px; }
    .forecast-drawer.open { bottom: 60px; }
    .timeline-bar { padding: 30px 10px 10px; }
    .legend { left: 10px; bottom: 66px; }
    .freshness { bottom: 66px; right: 10px; }
    .locate-btn { display: none; }
  }
</style>
</head>
<body>

<!-- ════════════════════════════════════════════
     MAP
     ════════════════════════════════════════════ -->
<div id="map"></div>

<!-- ════════════════════════════════════════════
     TOP BAR
     ════════════════════════════════════════════ -->
<div class="top-bar">
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M3 8c3-4 6-5 9-3s6 1 9-3" stroke-linecap="round"/>
      <path d="M3 14c3-4 6-5 9-3s6 1 9-3" stroke-linecap="round" opacity="0.5"/>
      <path d="M3 20c3-4 6-5 9-3s6 1 9-3" stroke-linecap="round" opacity="0.25"/>
    </svg>
    <span class="logo-text">Gale</span>
    <span class="logo-badge">Alpha</span>
  </div>

  <div class="search-container">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input class="search-input" type="text" placeholder="Search city or address..." id="searchInput" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     LAYER SIDEBAR
     ════════════════════════════════════════════ -->
<div class="sidebar">
  <button class="layer-btn active" data-layer="radar" title="Radar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a9 9 0 000 12.73"/><path d="M17.7 6.3a9 9 0 010 12.73"/>
    </svg>
    <span>Radar</span>
  </button>

  <button class="layer-btn active" data-layer="temp" title="Temperature">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 9V2m0 0L9 5m3-3l3 3"/><path d="M12 15v7m0 0l3-3m-3 3l-3-3"/><circle cx="12" cy="12" r="3"/>
    </svg>
    <span>Temp</span>
  </button>

  <button class="layer-btn" data-layer="wind" title="Wind">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M9.59 4.59A2 2 0 1111 8H2"/><path d="M12.59 19.41A2 2 0 1014 16H2"/><path d="M17.73 7.73A2.5 2.5 0 1119.5 12H2"/>
    </svg>
    <span>Wind</span>
  </button>

  <button class="layer-btn" data-layer="precip" title="Precipitation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/>
    </svg>
    <span>Precip</span>
  </button>

  <button class="layer-btn" data-layer="satellite" title="Satellite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><ellipse cx="12" cy="12" rx="4" ry="10"/>
    </svg>
    <span>Satellite</span>
  </button>

  <div class="layer-divider"></div>

  <button class="layer-btn" data-layer="alerts" title="NWS Alerts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <span>Alerts</span>
  </button>
</div>

<!-- ════════════════════════════════════════════
     LEGEND
     ════════════════════════════════════════════ -->
<div class="legend" id="legend">
  <div>
    <div class="legend-gradient temp" id="legendGradient"></div>
    <div class="legend-labels">
      <span id="legendMin">-40°F</span>
      <span id="legendMax">120°F</span>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     LOCATE ME
     ════════════════════════════════════════════ -->
<button class="locate-btn" id="locateBtn" title="My location">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

<!-- ════════════════════════════════════════════

<script>
(function() {
  'use strict';

  // ─── Map Setup ──────────────────────────────
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      name: 'Gale Dark',
      glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
      sources: {
        'carto-dark': {
          type: 'raster',
          tiles: [
            'https://a.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}@2x.png',
            'https://b.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}@2x.png',
            'https://c.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}@2x.png'
          ],
          tileSize: 256,
          attribution: '&copy; <a href="https://carto.com">CARTO</a> &copy; <a href="https://osm.org">OSM</a>'
        }
      },
      layers: [{
        id: 'carto-dark-layer',
        type: 'raster',
        source: 'carto-dark',
        minzoom: 0,
        maxzoom: 19
      }]
    },
    center: [-94.3, 46.3], // Minnesota
    zoom: 6,
    maxZoom: 12,
    minZoom: 2,
    attributionControl: true
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

  // ─── Tile Base URL (Cloudflare R2) ────────────
  const TILE_BASE = 'https://pub-9975b1cfcbf9480f9e1333c7e208a6ce.r2.dev';

  // ─── Layer State ────────────────────────────
  const layers = {
    radar: true,
    temp: true,
    wind: false,
    precip: false,
    satellite: false,
    alerts: false
  };

  // ─── Add Map Layers (order matters: bottom → top) ───
  map.on('load', () => {
    // HRRR Temperature — Cloudflare R2 tiles (base layer, renders below radar)
    map.addSource('temperature', {
      type: 'raster',
      tiles: [
        `${TILE_BASE}/temperature/{z}/{x}/{y}.png`
      ],
      tileSize: 256,
      minzoom: 2,
      maxzoom: 6,
      attribution: '&copy; NOAA HRRR via Gale'
    });

    map.addLayer({
      id: 'temperature-layer',
      type: 'raster',
      source: 'temperature',
      paint: {
        'raster-opacity': 0.25,
        'raster-fade-duration': 300
      }
    });

    // HRRR Wind Speed — Cloudflare R2 tiles
    map.addSource('wind', {
      type: 'raster',
      tiles: [
        `${TILE_BASE}/wind/{z}/{x}/{y}.png`
      ],
      tileSize: 256,
      minzoom: 2,
      maxzoom: 6,
      attribution: '&copy; NOAA HRRR via Gale'
    });

    map.addLayer({
      id: 'wind-layer',
      type: 'raster',
      source: 'wind',
      paint: {
        'raster-opacity': 0.5,
        'raster-fade-duration': 300
      },
      layout: { visibility: 'none' }
    });

    // HRRR Precipitation — Cloudflare R2 tiles
    map.addSource('precipitation', {
      type: 'raster',
      tiles: [
        `${TILE_BASE}/precipitation/{z}/{x}/{y}.png`
      ],
      tileSize: 256,
      minzoom: 2,
      maxzoom: 6,
      attribution: '&copy; NOAA HRRR via Gale'
    });

    map.addLayer({
      id: 'precipitation-layer',
      type: 'raster',
      source: 'precipitation',
      paint: {
        'raster-opacity': 0.5,
        'raster-fade-duration': 300
      },
      layout: { visibility: 'none' }
    });

    // MRMS Radar — Iowa State Mesonet (renders on top of temperature/wind/precip)
    map.addSource('radar', {
      type: 'raster',
      tiles: [
        'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png'
      ],
      tileSize: 256,
      attribution: '&copy; <a href="https://mesonet.agron.iastate.edu">Iowa State Mesonet</a>'
    });

    map.addLayer({
      id: 'radar-layer',
      type: 'raster',
      source: 'radar',
      paint: {
        'raster-opacity': 0.7,
        'raster-fade-duration': 300
      }
    });

    // Satellite — GOES visible via Iowa State Mesonet
    map.addSource('satellite', {
      type: 'raster',
      tiles: [
        'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/goes-vis-1km-900913/{z}/{x}/{y}.png'
      ],
      tileSize: 256,
      attribution: '&copy; <a href="https://mesonet.agron.iastate.edu">Iowa State Mesonet</a> / NOAA GOES'
    });

    map.addLayer({
      id: 'satellite-layer',
      type: 'raster',
      source: 'satellite',
      paint: {
        'raster-opacity': 0.6,
        'raster-fade-duration': 300
      },
      layout: { visibility: 'none' }
    });

    // NWS Alerts (GeoJSON)
    map.addSource('alerts', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });

    map.addLayer({
      id: 'alerts-fill',
      type: 'fill',
      source: 'alerts',
      paint: {
        'fill-color': [
          'match',
          ['get', 'severity'],
          'Extreme', '#dc2626',
          'Severe', '#f97316',
          'Moderate', '#eab308',
          'Minor', '#3b82f6',
          '#6b7280'
        ],
        'fill-opacity': 0.2
      },
      layout: { visibility: 'none' }
    });

    map.addLayer({
      id: 'alerts-line',
      type: 'line',
      source: 'alerts',
      paint: {
        'line-color': [
          'match',
          ['get', 'severity'],
          'Extreme', '#dc2626',
          'Severe', '#f97316',
          'Moderate', '#eab308',
          'Minor', '#3b82f6',
          '#6b7280'
        ],
        'line-width': 1.5,
        'line-opacity': 0.8
      },
      layout: { visibility: 'none' }
    });

    // US State Boundaries (always visible)
    map.addSource('states', {
      type: 'geojson',
      data: 'https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json'
    });

    map.addLayer({
      id: 'state-borders',
      type: 'line',
      source: 'states',
      paint: {
        'line-color': 'rgba(255, 255, 255, 0.25)',
        'line-width': [
          'interpolate', ['linear'], ['zoom'],
          2, 0.5,
          6, 1.5,
          10, 2
        ]
      }
    });

    // Temperature labels — shows current temp at key cities
    map.addSource('temp-labels', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });

    map.addLayer({
      id: 'temp-labels-layer',
      type: 'symbol',
      source: 'temp-labels',
      layout: {
        'text-field': ['get', 'label'],
        'text-size': 13,
        'text-font': ['Open Sans Semibold'],
        'text-allow-overlap': false,
        'text-ignore-placement': false,
        'text-padding': 8
      },
      paint: {
        'text-color': '#ffffff',
        'text-halo-color': 'rgba(0, 0, 0, 0.7)',
        'text-halo-width': 1.5
      }
    });

    // ── Vector Place Labels (OpenFreeMap, renders above all weather) ──
    map.addSource('labels', {
      type: 'vector',
      tiles: ['https://tiles.openfreemap.org/data/v3/{z}/{x}/{y}.pbf'],
      maxzoom: 14
    });

    // Shared paint for frosted dark halo
    const labelHalo = {
      'text-halo-color': 'rgba(10, 14, 23, 0.85)',
      'text-halo-width': 2,
      'text-halo-blur': 1.5
    };

    // Tier 1: State names (zoom 3–7, uppercase, muted)
    map.addLayer({
      id: 'place-state',
      type: 'symbol',
      source: 'labels',
      'source-layer': 'place',
      filter: ['==', 'class', 'state'],
      minzoom: 3,
      maxzoom: 7,
      layout: {
        'text-field': ['get', 'name'],
        'text-font': ['Open Sans Semibold'],
        'text-size': 11,
        'text-transform': 'uppercase',
        'text-letter-spacing': 0.1,
        'text-allow-overlap': false,
        'text-padding': 4
      },
      paint: {
        'text-color': '#94a3b8',
        ...labelHalo,
        'text-opacity': [
          'interpolate', ['linear'], ['zoom'],
          3, 0, 4, 1, 6, 1, 7, 0
        ]
      }
    });

    // Tier 2: Major cities — rank ≤ 3 (zoom 4+)
    map.addLayer({
      id: 'place-city-major',
      type: 'symbol',
      source: 'labels',
      'source-layer': 'place',
      filter: ['all', ['==', 'class', 'city'], ['<=', 'rank', 3]],
      minzoom: 4,
      layout: {
        'text-field': ['get', 'name'],
        'text-font': ['Open Sans Semibold'],
        'text-size': [
          'interpolate', ['linear'], ['zoom'],
          4, 14, 10, 18
        ],
        'text-allow-overlap': false,
        'text-padding': 4
      },
      paint: {
        'text-color': '#e2e8f0',
        ...labelHalo,
        'text-opacity': [
          'interpolate', ['linear'], ['zoom'],
          4, 0, 5, 1
        ]
      }
    });

    // Tier 3: Other cities — rank > 3 (zoom 6+)
    map.addLayer({
      id: 'place-city',
      type: 'symbol',
      source: 'labels',
      'source-layer': 'place',
      filter: ['all', ['==', 'class', 'city'], ['>', 'rank', 3]],
      minzoom: 6,
      layout: {
        'text-field': ['get', 'name'],
        'text-font': ['Open Sans Semibold'],
        'text-size': [
          'interpolate', ['linear'], ['zoom'],
          6, 12, 10, 15
        ],
        'text-allow-overlap': false,
        'text-padding': 4
      },
      paint: {
        'text-color': '#e2e8f0',
        ...labelHalo,
        'text-opacity': [
          'interpolate', ['linear'], ['zoom'],
          6, 0, 7, 1
        ]
      }
    });

    // Tier 4: Towns (zoom 9+)
    map.addLayer({
      id: 'place-town',
      type: 'symbol',
      source: 'labels',
      'source-layer': 'place',
      filter: ['==', 'class', 'town'],
      minzoom: 9,
      layout: {
        'text-field': ['get', 'name'],
        'text-font': ['Open Sans Semibold'],
        'text-size': 11,
        'text-allow-overlap': false,
        'text-padding': 4
      },
      paint: {
        'text-color': '#cbd5e1',
        ...labelHalo,
        'text-opacity': [
          'interpolate', ['linear'], ['zoom'],
          9, 0, 10, 1
        ]
      }
    });

    // Fetch alerts
    fetchAlerts();

    updateLayerVisibility();
  });

  // ─── Temperature Labels (sampled from tile pixels) ───
  // Color ramp: Celsius → RGBA (must match temperature_ramp.txt)
  const TEMP_RAMP = [
    { c: -40, r: 30,  g: 58,  b: 95  },
    { c: -29, r: 37,  g: 99,  b: 235 },
    { c: -18, r: 6,   g: 182, b: 212 },
    { c: -7,  r: 16,  g: 185, b: 129 },
    { c: 5,   r: 132, g: 204, b: 22  },
    { c: 16,  r: 234, g: 179, b: 8   },
    { c: 27,  r: 249, g: 115, b: 22  },
    { c: 38,  r: 239, g: 68,  b: 68  },
    { c: 49,  r: 153, g: 27,  b: 27  },
  ];

  // Wind speed ramp: m/s → RGBA (must match wind_ramp.txt)
  const WIND_RAMP = [
    { v: 0,  r: 0,   g: 0,   b: 0   },
    { v: 1,  r: 200, g: 230, b: 255 },
    { v: 5,  r: 100, g: 180, b: 255 },
    { v: 10, r: 50,  g: 120, b: 230 },
    { v: 15, r: 50,  g: 200, b: 100 },
    { v: 20, r: 230, g: 230, b: 50  },
    { v: 25, r: 230, g: 150, b: 30  },
    { v: 30, r: 230, g: 80,  b: 30  },
    { v: 35, r: 200, g: 30,  b: 30  },
    { v: 40, r: 150, g: 0,   b: 80  },
  ];

  // Precip ramp: mm → RGBA (must match precip_ramp.txt)
  const PRECIP_RAMP = [
    { v: 0,   r: 0,   g: 0,   b: 0   },
    { v: 0.1, r: 170, g: 220, b: 170 },
    { v: 1,   r: 100, g: 200, b: 100 },
    { v: 5,   r: 50,  g: 180, b: 50  },
    { v: 10,  r: 50,  g: 150, b: 255 },
    { v: 15,  r: 30,  g: 100, b: 230 },
    { v: 25,  r: 200, g: 200, b: 50  },
    { v: 35,  r: 230, g: 130, b: 30  },
    { v: 50,  r: 200, g: 30,  b: 50  },
  ];

  // Generic reverse-ramp: RGB pixel → physical value
  function reverseRamp(r, g, b, ramp, valKey) {
    let bestVal = null, bestError = Infinity;

    for (let i = 0; i < ramp.length - 1; i++) {
      const a = ramp[i], n = ramp[i + 1];
      const dr = n.r - a.r, dg = n.g - a.g, db = n.b - a.b;

      const tVals = [];
      if (Math.abs(dr) > 2) tVals.push((r - a.r) / dr);
      if (Math.abs(dg) > 2) tVals.push((g - a.g) / dg);
      if (Math.abs(db) > 2) tVals.push((b - a.b) / db);
      if (tVals.length === 0) continue;

      const avgT = tVals.reduce((s, v) => s + v, 0) / tVals.length;
      const maxDev = Math.max(...tVals.map(t => Math.abs(t - avgT)));
      if (avgT < -0.1 || avgT > 1.1 || maxDev > 0.2) continue;

      const t = Math.max(0, Math.min(1, avgT));
      const er = a.r + t * dr, eg = a.g + t * dg, eb = a.b + t * db;
      const error = (r - er) ** 2 + (g - eg) ** 2 + (b - eb) ** 2;

      if (error < bestError) {
        bestError = error;
        bestVal = a[valKey] + t * (n[valKey] - a[valKey]);
      }
    }

    if (bestVal === null) {
      let bestIdx = 0, bestDist = Infinity;
      for (let i = 0; i < ramp.length; i++) {
        const d = (r - ramp[i].r) ** 2 + (g - ramp[i].g) ** 2 + (b - ramp[i].b) ** 2;
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      bestVal = ramp[bestIdx][valKey];
    }

    return bestVal;
  }

  function rgbToTempF(r, g, b) {
    const celsius = reverseRamp(r, g, b, TEMP_RAMP, 'c');
    return Math.round(celsius * 9 / 5 + 32);
  }

  function rgbToWindMph(r, g, b) {
    const ms = reverseRamp(r, g, b, WIND_RAMP, 'v');
    return Math.round(ms * 2.237);
  }

  function rgbToPrecipIn(r, g, b) {
    const mm = reverseRamp(r, g, b, PRECIP_RAMP, 'v');
    return +(mm * 0.03937).toFixed(2);
  }

  // Tile pixel reading via offscreen canvas
  const tileCache = {};
  const offCanvas = document.createElement('canvas');
  offCanvas.width = 256; offCanvas.height = 256;
  const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

  function lngLatToTile(lng, lat, zoom) {
    const x = Math.floor((lng + 180) / 360 * (1 << zoom));
    const latRad = lat * Math.PI / 180;
    const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1/Math.cos(latRad)) / Math.PI) / 2 * (1 << zoom));
    return { x, y, z: zoom };
  }

  function lngLatToPixelInTile(lng, lat, z, tx, ty) {
    const n = 1 << z;
    const px = ((lng + 180) / 360 * n - tx) * 256;
    const latRad = lat * Math.PI / 180;
    const py = ((1 - Math.log(Math.tan(latRad) + 1/Math.cos(latRad)) / Math.PI) / 2 * n - ty) * 256;
    return { px: Math.floor(px), py: Math.floor(py) };
  }

  function sampleTileAt(lng, lat, layerName) {
    const layerPath = layerName || 'temperature';
    const converter = layerPath === 'wind' ? rgbToWindMph
                    : layerPath === 'precipitation' ? rgbToPrecipIn
                    : rgbToTempF;

    return new Promise((resolve) => {
      const z = Math.min(Math.floor(map.getZoom()), 6);
      if (z < 2) { resolve(null); return; }
      const { x, y } = lngLatToTile(lng, lat, z);
      const { px, py } = lngLatToPixelInTile(lng, lat, z, x, y);
      if (px < 0 || px > 255 || py < 0 || py > 255) { resolve(null); return; }

      const tileUrl = `${TILE_BASE}/${layerPath}/${z}/${x}/${y}.png`;
      const cached = tileCache[tileUrl];
      if (cached) {
        offCtx.clearRect(0, 0, 256, 256);
        offCtx.drawImage(cached, 0, 0);
        const d = offCtx.getImageData(px, py, 1, 1).data;
        resolve(d[3] > 50 ? converter(d[0], d[1], d[2]) : null);
        return;
      }

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        tileCache[tileUrl] = img;
        offCtx.clearRect(0, 0, 256, 256);
        offCtx.drawImage(img, 0, 0);
        const d = offCtx.getImageData(px, py, 1, 1).data;
        resolve(d[3] > 50 ? converter(d[0], d[1], d[2]) : null);
      };
      img.onerror = () => resolve(null);
      img.src = tileUrl;
    });
  }

  async function updateTempLabels() {
    if (!layers.temp) return;
    const bounds = map.getBounds();
    const west = bounds.getWest(), east = bounds.getEast();
    const north = bounds.getNorth(), south = bounds.getSouth();
    const lngStep = (east - west) / 4;
    const latStep = (north - south) / 3;

    const features = [];
    const promises = [];
    // Sample a 3x2 grid of points across the viewport
    for (let row = 0.5; row < 3; row++) {
      for (let col = 0.5; col < 4; col++) {
        const lng = west + col * lngStep;
        const lat = south + row * latStep;
        promises.push(sampleTileAt(lng, lat, 'temperature').then(tempF => {
          if (tempF !== null) {
            features.push({
              type: 'Feature',
              geometry: { type: 'Point', coordinates: [lng, lat] },
              properties: { label: `${tempF}°F` }
            });
          }
        }));
      }
    }
    await Promise.all(promises);
    if (map.getSource('temp-labels')) {
      map.getSource('temp-labels').setData({ type: 'FeatureCollection', features });
    }
  }

  map.on('moveend', updateTempLabels);
  map.on('zoomend', updateTempLabels);
  setTimeout(updateTempLabels, 2000); // initial load

  // ─── Fetch NWS Alerts ───────────────────────
  async function fetchAlerts() {
    try {
      const resp = await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert');
      const data = await resp.json();
      if (map.getSource('alerts')) {
        map.getSource('alerts').setData(data);
      }
    } catch (e) {
      console.warn('Failed to fetch NWS alerts:', e);
    }
  }

  // ─── Radar Auto-Refresh ─────────────────────
  setInterval(() => {
    if (layers.radar && map.getSource('radar')) {
      // Force tile refresh by updating source tiles with cache-bust
      const ts = Date.now();
      map.getSource('radar').setTiles([
        `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png?_=${ts}`
      ]);
      document.getElementById('freshnessText').textContent = `MRMS ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
    }
  }, 120000); // 2 minutes

  // ─── Service Worker (persistent tile cache + offline) ─────
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // ─── Smart HRRR Freshness (skip network when no new data exists) ─────
  let lastTempRun = '';

  // Restore last known run from localStorage (instant display, no network)
  const storedHrrr = JSON.parse(localStorage.getItem('gale_hrrr') || 'null');
  if (storedHrrr) {
    lastTempRun = storedHrrr.run;
    document.getElementById('freshnessText').textContent =
      `HRRR ${storedHrrr.hour}Z · MRMS live`;
  }

  function nextHrrrAvailable() {
    // HRRR publishes hourly, available ~20 min after the hour.
    // Given the last known run, calculate when a newer one might exist.
    if (!storedHrrr) return 0; // No stored data — check immediately
    const d = storedHrrr.date; // "20260217"
    const h = parseInt(storedHrrr.hour, 10);
    const yr = parseInt(d.slice(0,4)), mo = parseInt(d.slice(4,6)) - 1, dy = parseInt(d.slice(6,8));
    // Next run = lastHour + 1, available at :22 (2 min buffer)
    return Date.UTC(yr, mo, dy, h + 1, 22, 0);
  }

  async function checkTempFreshness() {
    // Smart skip: don't hit the network if no new HRRR run can exist yet
    if (Date.now() < nextHrrrAvailable()) return;

    try {
      const resp = await fetch(`${TILE_BASE}/temperature/metadata.json?_=${Date.now()}`);
      if (!resp.ok) return;
      const meta = await resp.json();

      // Persist for next session / next check
      localStorage.setItem('gale_hrrr', JSON.stringify({
        run: meta.hrrr_run, date: meta.hrrr_date, hour: meta.hrrr_hour
      }));

      if (meta.hrrr_run && meta.hrrr_run !== lastTempRun) {
        lastTempRun = meta.hrrr_run;
        // Tell service worker to purge stale tile cache
        if (navigator.serviceWorker?.controller) {
          navigator.serviceWorker.controller.postMessage('clear-tiles');
        }
        // Clear in-memory pixel-sampling cache
        Object.keys(tileCache).forEach(k => delete tileCache[k]);
        const ts = Date.now();
        ['temperature', 'wind', 'precipitation'].forEach(src => {
          if (map.getSource(src)) {
            map.getSource(src).setTiles([
              `${TILE_BASE}/${src}/{z}/{x}/{y}.png?_=${ts}`
            ]);
          }
        });
        setTimeout(updateTempLabels, 1000);
        document.getElementById('freshnessText').textContent =
          `HRRR ${meta.hrrr_hour}Z · MRMS live`;
      }
    } catch (e) { /* offline — SW serves cached tiles */ }
  }

  // Check immediately on load, then every 5 min (smart skip avoids needless fetches)
  checkTempFreshness();
  setInterval(checkTempFreshness, 300000);

  // ─── Layer Toggle ───────────────────────────
  function updateLayerVisibility() {
    if (map.getLayer('radar-layer')) {
      map.setLayoutProperty('radar-layer', 'visibility', layers.radar ? 'visible' : 'none');
    }
    if (map.getLayer('temperature-layer')) {
      map.setLayoutProperty('temperature-layer', 'visibility', layers.temp ? 'visible' : 'none');
      if (layers.temp) {
        const tempOpacity = layers.radar ? 0.25 : 0.6;
        map.setPaintProperty('temperature-layer', 'raster-opacity', tempOpacity);
      }
    }
    if (map.getLayer('temp-labels-layer')) {
      map.setLayoutProperty('temp-labels-layer', 'visibility', layers.temp ? 'visible' : 'none');
    }
    if (map.getLayer('wind-layer')) {
      map.setLayoutProperty('wind-layer', 'visibility', layers.wind ? 'visible' : 'none');
      if (layers.wind) {
        const windOpacity = layers.radar ? 0.3 : 0.5;
        map.setPaintProperty('wind-layer', 'raster-opacity', windOpacity);
      }
    }
    if (map.getLayer('precipitation-layer')) {
      map.setLayoutProperty('precipitation-layer', 'visibility', layers.precip ? 'visible' : 'none');
      if (layers.precip) {
        const precipOpacity = layers.radar ? 0.3 : 0.5;
        map.setPaintProperty('precipitation-layer', 'raster-opacity', precipOpacity);
      }
    }
    if (map.getLayer('satellite-layer')) {
      map.setLayoutProperty('satellite-layer', 'visibility', layers.satellite ? 'visible' : 'none');
    }
    if (map.getLayer('alerts-fill')) {
      map.setLayoutProperty('alerts-fill', 'visibility', layers.alerts ? 'visible' : 'none');
      map.setLayoutProperty('alerts-line', 'visibility', layers.alerts ? 'visible' : 'none');
    }

    // Legend priority: radar > precip > wind > temp
    const legend = document.getElementById('legend');
    const grad = document.getElementById('legendGradient');
    const lMin = document.getElementById('legendMin');
    const lMax = document.getElementById('legendMax');

    if (layers.radar) {
      legend.classList.add('visible');
      grad.className = 'legend-gradient radar';
      lMin.textContent = 'Light';
      lMax.textContent = 'Heavy';
    } else if (layers.precip) {
      legend.classList.add('visible');
      grad.className = 'legend-gradient precip';
      lMin.textContent = '0 in';
      lMax.textContent = '2 in';
    } else if (layers.wind) {
      legend.classList.add('visible');
      grad.className = 'legend-gradient wind';
      lMin.textContent = '0 mph';
      lMax.textContent = '90 mph';
    } else if (layers.temp) {
      legend.classList.add('visible');
      grad.className = 'legend-gradient temp';
      lMin.textContent = '-40°F';
      lMax.textContent = '120°F';
    } else {
      legend.classList.remove('visible');
    }
  }

  document.querySelectorAll('.layer-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const layer = btn.dataset.layer;
      layers[layer] = !layers[layer];
      btn.classList.toggle('active', layers[layer]);
      updateLayerVisibility();
    });
  });

  // ─── Search (Nominatim) ─────────────────────
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  let searchTimeout;

  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    const q = searchInput.value.trim();
    if (q.length < 3) { searchResults.classList.remove('active'); return; }

    searchTimeout = setTimeout(async () => {
      try {
        const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=us&limit=5`);
        const results = await resp.json();
        searchResults.innerHTML = '';
        if (results.length === 0) {
          searchResults.classList.remove('active');
          return;
        }
        results.forEach(r => {
          const item = document.createElement('div');
          item.className = 'search-result-item';
          item.textContent = r.display_name;
          item.addEventListener('click', () => {
            map.flyTo({ center: [parseFloat(r.lon), parseFloat(r.lat)], zoom: 8, duration: 1500 });
            searchResults.classList.remove('active');
            searchInput.value = r.display_name.split(',')[0];
          });
          searchResults.appendChild(item);
        });
        searchResults.classList.add('active');
      } catch (e) { console.warn('Search error:', e); }
    }, 350);
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-container')) searchResults.classList.remove('active');
  });

  // ─── Point Forecast (NWS API) ───────────────
  const drawer = document.getElementById('forecastDrawer');

  map.on('click', async (e) => {
    const { lng, lat } = e.lngLat;

    // Only fetch forecast for CONUS
    if (lat < 24 || lat > 50 || lng < -125 || lng > -66) return;

    document.getElementById('forecastLocation').textContent = 'Loading...';
    document.getElementById('forecastCoords').textContent = `${lat.toFixed(4)}°N, ${Math.abs(lng).toFixed(4)}°W`;
    document.getElementById('forecastTemp').innerHTML = '—<span>°F</span>';
    document.getElementById('forecastCondition').textContent = 'Sampling HRRR tiles...';
    document.getElementById('fWind').textContent = '—';
    document.getElementById('fHumidity').textContent = '—';
    document.getElementById('fDewpoint').textContent = '—';
    document.getElementById('fPrecip').textContent = '—';
    drawer.classList.add('open');

    // Phase 1: Instant HRRR tile sampling (parallel, <200ms)
    const [tempF, windMph, precipIn] = await Promise.all([
      sampleTileAt(lng, lat, 'temperature'),
      sampleTileAt(lng, lat, 'wind'),
      sampleTileAt(lng, lat, 'precipitation')
    ]);

    if (tempF !== null) {
      document.getElementById('forecastTemp').innerHTML = `${tempF}<span>°F</span>`;
    }
    if (windMph !== null) {
      document.getElementById('fWind').textContent = `${windMph} mph`;
    }
    if (precipIn !== null) {
      document.getElementById('fPrecip').textContent = precipIn > 0 ? `${precipIn} in` : 'None';
    }
    document.getElementById('forecastCondition').textContent = 'HRRR data · fetching NWS details...';

    // Phase 2: Async NWS API (2-5s, fills in city name + supplemental data)
    try {
      const pointResp = await fetch(`https://api.weather.gov/points/${lat.toFixed(4)},${lng.toFixed(4)}`, {
        headers: { 'User-Agent': 'Gale Weather (galeweather.com)' }
      });
      const pointData = await pointResp.json();

      const city = pointData.properties?.relativeLocation?.properties;
      const locName = city ? `${city.city}, ${city.state}` : `${lat.toFixed(2)}°N`;
      document.getElementById('forecastLocation').textContent = locName;

      if (!pointData.properties?.forecastHourly) {
        document.getElementById('forecastCondition').textContent = 'HRRR data · NWS grid unavailable';
        return;
      }

      const fcResp = await fetch(pointData.properties.forecastHourly, {
        headers: { 'User-Agent': 'Gale Weather (galeweather.com)' }
      });
      const fcData = await fcResp.json();
      const now = fcData.properties.periods[0];

      // NWS overrides HRRR temp if available (NWS is observation-corrected)
      document.getElementById('forecastTemp').innerHTML = `${now.temperature}<span>°${now.temperatureUnit}</span>`;
      document.getElementById('forecastCondition').textContent = now.shortForecast;
      document.getElementById('fWind').textContent = now.windSpeed;
      document.getElementById('fHumidity').textContent = now.relativeHumidity?.value ? `${Math.round(now.relativeHumidity.value)}%` : '—';
      document.getElementById('fDewpoint').textContent = now.dewpoint?.value ? `${Math.round(now.dewpoint.value * 9/5 + 32)}°F` : '—';
      document.getElementById('fPrecip').textContent = now.probabilityOfPrecipitation?.value ? `${now.probabilityOfPrecipitation.value}%` : (precipIn !== null && precipIn > 0 ? `${precipIn} in` : '0%');

    } catch (err) {
      console.warn('NWS forecast error:', err);
      // HRRR values stay visible — just update the status text
      document.getElementById('forecastLocation').textContent = tempF !== null ? `${lat.toFixed(2)}°N, ${Math.abs(lng).toFixed(2)}°W` : 'Forecast unavailable';
      document.getElementById('forecastCondition').textContent = tempF !== null ? 'HRRR data · NWS unavailable' : 'NWS API may be temporarily down';
    }
  });

  document.getElementById('forecastClose').addEventListener('click', () => {
    drawer.classList.remove('open');
  });

  // ─── Timeline (radar animation frames) ──────
  // Slider: 0 = oldest (-50 min), 10 = now. Left-to-right = past-to-present.
  const timeSlider = document.getElementById('timeSlider');
  const timeLabel = document.getElementById('timeLabel');
  const playBtn = document.getElementById('playBtn');
  let playing = false;
  let playInterval;

  // Iowa State Mesonet time-stamped radar tiles (index 0 = now, 10 = -50 min)
  const radarProducts = [
    'nexrad-n0q-900913',           // Now
    'nexrad-n0q-900913-m05m',      // 5 min ago
    'nexrad-n0q-900913-m10m',      // 10 min ago
    'nexrad-n0q-900913-m15m',      // 15 min ago
    'nexrad-n0q-900913-m20m',      // 20 min ago
    'nexrad-n0q-900913-m25m',      // 25 min ago
    'nexrad-n0q-900913-m30m',      // 30 min ago
    'nexrad-n0q-900913-m35m',      // 35 min ago
    'nexrad-n0q-900913-m40m',      // 40 min ago
    'nexrad-n0q-900913-m45m',      // 45 min ago
    'nexrad-n0q-900913-m50m',      // 50 min ago
  ];

  // Slider value → radar product index (reverse: slider 0=oldest, 10=now)
  function sliderToRadarIdx(sliderVal) {
    return radarProducts.length - 1 - sliderVal;
  }

  function positionTimeLabel() {
    const pct = (timeSlider.value - timeSlider.min) / (timeSlider.max - timeSlider.min);
    const sliderWidth = timeSlider.offsetWidth;
    const thumbOffset = 8 + pct * (sliderWidth - 16); // account for thumb radius
    timeLabel.style.left = thumbOffset + 'px';
  }

  timeSlider.addEventListener('input', () => {
    const sliderVal = parseInt(timeSlider.value);
    updateRadarFrame(sliderToRadarIdx(sliderVal));
    positionTimeLabel();
  });

  // Position label on load
  setTimeout(positionTimeLabel, 100);
  window.addEventListener('resize', positionTimeLabel);

  function updateRadarFrame(radarIdx) {
    if (!map.getSource('radar')) return;
    const product = radarProducts[radarIdx];
    map.getSource('radar').setTiles([
      `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/${product}/{z}/{x}/{y}.png`
    ]);
    if (radarIdx === 0) {
      timeLabel.textContent = 'Now';
    } else {
      timeLabel.textContent = `-${radarIdx * 5} min`;
    }
  }

  playBtn.addEventListener('click', () => {
    playing = !playing;
    if (playing) {
      playBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>';
      // Start from oldest (left), play right toward now
      let frame = 0;
      timeSlider.value = frame;
      updateRadarFrame(sliderToRadarIdx(frame));

      playInterval = setInterval(() => {
        frame++;
        if (frame > radarProducts.length - 1) frame = 0;
        timeSlider.value = frame;
        updateRadarFrame(sliderToRadarIdx(frame));
      }, 500);
    } else {
      playBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';
      clearInterval(playInterval);
    }
  });

  // ─── Locate Me ──────────────────────────────
  document.getElementById('locateBtn').addEventListener('click', () => {
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          map.flyTo({
            center: [pos.coords.longitude, pos.coords.latitude],
            zoom: 8,
            duration: 1500
          });
        },
        () => console.warn('Location access denied')
      );
    }
  });

  // ─── Keyboard Shortcuts ─────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    switch(e.key) {
      case '/': e.preventDefault(); searchInput.focus(); break;
      case 'Escape': drawer.classList.remove('open'); searchResults.classList.remove('active'); searchInput.blur(); break;
      case ' ': e.preventDefault(); playBtn.click(); break;
      case 'r': document.querySelector('[data-layer="radar"]').click(); break;
      case 't': document.querySelector('[data-layer="temp"]').click(); break;
      case 'w': document.querySelector('[data-layer="wind"]').click(); break;
      case 'p': document.querySelector('[data-layer="precip"]').click(); break;
      case 's': document.querySelector('[data-layer="satellite"]').click(); break;
    }
  });

})();
</script>
</body>
</html>
