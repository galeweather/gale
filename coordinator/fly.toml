app = "gale-coordinator"
primary_region = "ord"

[build]

[env]
  DB_PATH = "/data/gale.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "gale_data"
  destination = "/data"
