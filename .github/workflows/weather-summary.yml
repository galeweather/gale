name: Weather Summary (Twin Cities)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # manual trigger

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate weather summary
        env:
          GATEWAY_URL: https://llm.fulldigitaltwin.com/v1/messages
          GATEWAY_KEY_ID: worker-gale
          VK: vk-gale
          GATEWAY_HMAC_SECRET: ${{ secrets.GATEWAY_HMAC_SECRET }}
        run: python3 scripts/weather_summary.py

      - name: Upload summary to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp "scripts/output/summary/forecast.json" "s3://gale-tiles/summary/forecast.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --cache-control "public, max-age=3600" \
            --content-type "application/json" \
            --no-progress
