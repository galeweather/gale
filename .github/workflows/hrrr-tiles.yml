name: HRRR Weather Tiles

on:
  schedule:
    - cron: '20 * * * *'  # minute 20 past every hour
  workflow_dispatch:       # manual trigger for testing

jobs:
  generate-tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GDAL + numpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-gdal python3-numpy

      - name: Run temperature pipeline
        run: python3 scripts/hrrr_temperature.py

      - name: Run wind pipeline
        run: python3 scripts/hrrr_wind.py

      - name: Run precipitation pipeline
        run: python3 scripts/hrrr_precipitation.py

      - name: Run atmosphere pipeline
        run: python3 scripts/hrrr_atmosphere.py

      - name: Sync tiles to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          for layer in temperature temperature-f01 temperature-f02 temperature-f03 temperature-f04 temperature-f05 temperature-f06 temperature-f07 temperature-f08 temperature-f09 temperature-f10 temperature-f11 temperature-f12 wind precipitation precipitation-f02 precipitation-f03 precipitation-f04 precipitation-f05 precipitation-f06 precipitation-f07 precipitation-f08 precipitation-f09 precipitation-f10 precipitation-f11 precipitation-f12 wind-direction wind-u wind-v; do
            if [ ! -d "scripts/output/${layer}" ]; then
              echo "Skipping ${layer} — no output directory"
              continue
            fi
            echo "Syncing ${layer} tiles..."

            # Sync tile PNGs with 1-hour cache
            aws s3 sync "scripts/output/${layer}/" "s3://gale-tiles/${layer}/" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --delete \
              --size-only \
              --exclude "metadata.json" \
              --cache-control "public, max-age=3600" \
              --no-progress

            # Upload metadata.json with 5-minute cache
            aws s3 cp "scripts/output/${layer}/metadata.json" "s3://gale-tiles/${layer}/metadata.json" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --cache-control "public, max-age=300" \
              --content-type "application/json" \
              --no-progress
          done

          # Atmosphere profile: single binary file (not tiles)
          if [ -f "scripts/output/atmosphere/profile.bin" ]; then
            echo "Syncing atmosphere profile..."
            aws s3 cp "scripts/output/atmosphere/profile.bin" "s3://gale-tiles/atmosphere/profile.bin" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --cache-control "public, max-age=3600" \
              --content-type "application/octet-stream" \
              --no-progress
            aws s3 cp "scripts/output/atmosphere/metadata.json" "s3://gale-tiles/atmosphere/metadata.json" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --cache-control "public, max-age=300" \
              --content-type "application/json" \
              --no-progress
          fi
